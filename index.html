<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1020" media="(prefers-color-scheme: dark)">
<script>/* thème choisi sur cet appareil (avant l'affichage, pour éviter un flash) */
function applyTheme(t){try{t=t||localStorage.getItem('theme')||'auto'}catch(e){t='auto'}var r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);
var dk=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.setAttribute('content',dk?'#0D1020':'#F3F4F8');m.removeAttribute('media')});}
applyTheme();try{if(localStorage.getItem('mode')==='simple')document.documentElement.classList.add('simple')}catch(e){}</script>
<title>Suivi dépenses</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suivi dépenses">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
<style>
/* ============================================================
   1. COULEURS & TAILLES (tout le thème est ici)
   ============================================================ */
:root{
  --bg:#F3F4F8; --card:#FFFFFF; --soft:#F3F4F8; --hov:#F6F7FB;
  --ink:#151A2D; --ink2:#4A5068; --mute:#6B7189; --line:#E6E8F0;
  --acc:#4338CA; --acc-d:#3730A3; --acc-s:#E7E7FB; --acc-l:#A5B4FC;
  --ok:#047857; --ok-s:#ECFDF5; --warn:#8A4B00; --warn-s:#FFF4E5; --bad:#C2341F; --bad-s:#FDECEA;
  --hero:#1E1B4B; --hero-2:#3730A3; --hero-3:#6D28D9; --hero-t:#C7C9F5; --hero-line:#3A3775;
  --sav:#0F3D3A; --sav-2:#115E59; --sav-t:#A7E3D8; --sav-acc:#5EEAD4;
  --r:20px; --shadow:0 1px 2px rgba(21,26,45,.05),0 4px 16px rgba(21,26,45,.04);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1020; --card:#171B2E; --soft:#1F2439; --hov:#1C2135;
    --ink:#E8EAF4; --ink2:#B8BDD3; --mute:#8D93AD; --line:#2A2F48;
    --acc:#6366F1; --acc-d:#A5B4FC; --acc-s:#262A55; --acc-l:#818CF8;
    --ok:#34D399; --ok-s:#0F2E26; --warn:#FBBF24; --warn-s:#33270F; --bad:#F87171; --bad-s:#3A1A1A;
    --hero:#1B1846; --hero-line:#34316E;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0D1020; --card:#171B2E; --soft:#1F2439; --hov:#1C2135;
    --ink:#E8EAF4; --ink2:#B8BDD3; --mute:#8D93AD; --line:#2A2F48;
    --acc:#6366F1; --acc-d:#A5B4FC; --acc-s:#262A55; --acc-l:#818CF8;
    --ok:#34D399; --ok-s:#0F2E26; --warn:#FBBF24; --warn-s:#33270F; --bad:#F87171; --bad-s:#3A1A1A;
    --hero:#1B1846; --hero-line:#34316E;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
}

/* ============================================================
   2. BASES
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.num,input[type=number]{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
svg{flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============================================================
   3. MISE EN PAGE
   ============================================================ */
.app{display:flex;gap:24px;max-width:1320px;margin:0 auto;padding:24px;align-items:flex-start}
.side{width:220px;flex-shrink:0;position:sticky;top:24px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 14px 22px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--mute);font-weight:600;font-size:14px;border:0;background:none;min-height:44px;width:100%;text-align:left}
.nav:hover{background:var(--soft);color:var(--ink)}
.nav.on{background:var(--acc-s);color:var(--acc-d)}
.side .who{margin-top:18px;padding:12px 14px;font-size:12px;color:var(--mute);border-top:1px solid var(--line);word-break:break-all}
main{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.mnav{display:flex;align-items:center;gap:6px}
.top h1{margin:0 8px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.tools{display:flex;align-items:center;gap:10px}
.view{display:flex;flex-direction:column;gap:20px}
.grid2{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.grid2>.big{flex:2 1 420px;min-width:0}
.grid2>.small{flex:1 1 280px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}

/* ============================================================
   4. COMPOSANTS
   ============================================================ */
.card{background:var(--card);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow)}
.card h2,.h2{font-size:16px;font-weight:700;margin:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.lnk{background:none;border:0;color:var(--acc);font-weight:600;font-size:13px;padding:6px 0}
.lnk:hover{text-decoration:underline}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:var(--card);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;position:relative}
.ib:hover{background:var(--soft)}
.ib.sm{width:36px;height:36px;border-radius:10px;background:var(--soft)}
.btn{height:44px;padding:0 18px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--hov)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.danger:hover{background:var(--bad-s)}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.dot-badge{position:absolute;top:8px;right:8px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--mute)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip.cat.on{background:color-mix(in srgb,var(--c) 18%,var(--card));border-color:var(--c);color:var(--ink)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:5px 11px;white-space:nowrap;border:0;background:var(--soft);color:var(--ink2);min-height:28px}
.pill.ok{background:var(--ok-s);color:var(--ok)}
.pill.warn{background:var(--warn-s);color:var(--warn)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:none;color:var(--mute);font-weight:700;font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(21,26,45,.14)}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:0 12px;height:40px;color:var(--mute)}
.search input{border:0;background:none;outline:none;font-weight:500;width:150px;color:var(--ink)}
.in{height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-weight:600;background:var(--card);width:100%;color:var(--ink)}
.in:focus{border-color:var(--acc);outline:none}
.fl{font-size:12px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.fl small{font-weight:500}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--acc))}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:14px 10px 4px}
.lbl:first-child{padding-top:4px}
.empty{color:var(--mute);text-align:center;padding:26px 10px}
.note{font-size:13px;color:var(--mute)}
.alert{display:flex;align-items:center;gap:12px;background:var(--warn-s);color:var(--warn);border-radius:14px;padding:12px 16px;font-size:14px}
.alert.bad{background:var(--bad-s);color:var(--bad)}
.alert span{flex:1}
.alert .lnk{color:inherit;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:13px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend b{color:var(--ink)}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:3px}
.stack i{background:var(--c);min-width:3px}
.kp{background:var(--card);border-radius:18px;padding:16px 20px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.kp>span{font-size:13px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:2px}
.kp>b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kp>small{font-size:12px;color:var(--mute)}

/* Lignes de mouvement */
.row{display:flex;align-items:center;gap:8px;border-radius:12px}
.row:hover{background:var(--hov)}
.rowb{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:11px 10px;border:0;background:none;text-align:left;border-radius:12px}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs b.half{color:var(--acc);font-weight:600}
.ra{font-weight:700;font-size:14px;white-space:nowrap}
.ra.pos{color:var(--ok)}
.row .pill{margin-right:8px}
.ico{--c:#94A3B8;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden;
  background:color-mix(in srgb,var(--c) 17%,var(--card));color:color-mix(in srgb,var(--c) 72%,var(--ink))}
.ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:7px;background:#fff}
.ico.sm{width:32px;height:32px;border-radius:10px}
.ico.sm svg{width:17px;height:17px}

/* Infobulles */
.tip{position:relative;display:inline-flex;vertical-align:middle}
.tip>button{width:28px;height:28px;margin:-6px 0;border:0;border-radius:50%;background:none;color:inherit;opacity:.65;cursor:help;display:inline-flex;align-items:center;justify-content:center}
.tip>button:hover,.tip>button:focus-visible{opacity:1;background:color-mix(in srgb,currentColor 14%,transparent)}
.bub{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:300px;max-width:80vw;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.5;font-weight:500;text-align:left;letter-spacing:0;text-transform:none;box-shadow:0 12px 32px rgba(21,26,45,.2);opacity:0;visibility:hidden;transition:opacity .15s;z-index:40;pointer-events:none;white-space:normal}
.tip.dn .bub{bottom:auto;top:calc(100% + 8px)}
.tip.lf .bub{left:auto;right:-8px;transform:none}
.tip.rt .bub{left:-8px;transform:none}
.tip:hover .bub,.tip:focus-within .bub{opacity:1;visibility:visible}
.bub b.bt{display:block;font-weight:700;margin-bottom:4px;font-size:13px}
.eq{display:grid;grid-template-columns:1fr auto;gap:3px 14px;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.eq .tot{border-top:1px solid var(--line);padding-top:5px;font-weight:800}
.bub small{display:block;color:var(--mute);font-size:12px;margin-top:6px}

/* Carte principale (accueil) */
.hero{flex:2 1 420px;background:var(--hero);color:#fff;border-radius:24px;padding:28px 30px;display:flex;flex-direction:column;gap:22px;position:relative}
.hero .deco{position:absolute;inset:0;border-radius:24px;overflow:hidden;pointer-events:none}
.hero .deco i{position:absolute;border-radius:50%}
.hero>*:not(.deco){position:relative}
.hero .t{font-size:14px;font-weight:600;color:var(--hero-t);display:flex;align-items:center;gap:4px}
.hero .v{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.hero .v.neg{color:#FCA5A5}
.hero .s{font-size:14px;color:var(--hero-t)}
.hero .s b{color:#fff}
.hero .hb{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.hero .hb i{display:block;height:100%;border-radius:99px;background:var(--acc-l)}
.hero .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-top:1px solid var(--hero-line);padding-top:18px}
.hero .stats>div>span{font-size:12px;color:#B4B6EA;display:flex;align-items:center;gap:2px}
.hero .stats>div>b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.hero .bk{background:none;border:0;color:var(--hero-t);font-size:12px;font-weight:600;text-align:left;padding:2px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.3)}
.hero.sav{background:var(--sav)}
.hero.sav .t,.hero.sav .s{color:var(--sav-t)}
.hero.sav .hb i{background:var(--sav-acc)}

/* Calendrier échéancier */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wk{font-size:11px;font-weight:700;color:var(--mute);text-align:center;letter-spacing:.04em;padding-bottom:4px}
.cal .d{height:46px;border-radius:10px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600;color:var(--ink2)}
.cal .d.has{background:var(--soft)}
.cal .d.late{background:var(--warn-s);color:var(--warn)}
.cal .d.today{background:var(--acc);color:#fff}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--acc)}
.cal .d i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini>div{border-radius:12px;padding:10px 14px}
.mini span{display:flex;align-items:center;gap:2px;font-size:12px;font-weight:600}
.mini b{font-size:18px;font-variant-numeric:tabular-nums}

/* Tableaux */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:700;color:var(--mute);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{font-size:14px;text-align:right;padding:11px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.go{cursor:pointer}
tr.go:hover td{background:var(--hov)}
.tpl td{padding:5px 6px}
.tpl input,.tpl select{height:38px;border:1px solid transparent;border-radius:10px;background:var(--soft);padding:0 10px;font-weight:600;width:100%;color:var(--ink)}
.tpl input:focus,.tpl select:focus{border-color:var(--acc);outline:none;background:var(--card)}
.tpl input.d{width:56px;text-align:center}
.tpl input[type=number]{text-align:right;min-width:90px}
.tpl .half{height:38px;min-width:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:800;color:var(--mute)}
.tpl .half.on{background:var(--acc-s);border-color:var(--acc-l);color:var(--acc-d)}
.x{width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--mute);display:inline-flex;align-items:center;justify-content:center}
.x:hover{background:var(--bad-s);color:var(--bad)}
.cvh{position:relative;height:280px}

/* Comptes : sélecteur, menu, avatars */
.accsw{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;margin-bottom:14px;box-shadow:var(--shadow)}
.accsw:hover{border-color:var(--mute)}
.accsw>i,.accmenu .am>i,.accbig>i{width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--c);color:#fff;position:relative;overflow:hidden}
.accbig>i{width:40px;height:40px;border-radius:12px}
.accsw>i img,.accmenu .am>i img,.accbig>i img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5px;background:#fff;box-shadow:inset 0 0 0 2px var(--c);border-radius:inherit}
.accsw span,.accmenu .am span{flex:1;min-width:0;display:flex;flex-direction:column}
.accsw b,.accmenu b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.accsw small,.accmenu small{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-sw{display:none}
.tdate{font-size:13px;font-weight:600;color:var(--ink2);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:7px 12px;white-space:nowrap}
.tdate .tds{display:none}
@media (max-width:760px){input:not(#pn-a),select,textarea{font-size:16px!important}}   /* iPhone : évite le zoom automatique quand on touche un champ */
@media (display-mode: standalone){body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}}
@media (max-width:760px){.tdate .tdl{display:none}.tdate .tds{display:inline}.tdate{padding:6px 10px;font-size:12px}}
.hero .stats>div>small{display:block;margin-top:2px}
.accmenu{position:fixed;z-index:70;width:300px;max-width:calc(100% - 16px);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(13,16,32,.22);padding:6px;display:flex;flex-direction:column}
.accmenu .am{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:10px;text-align:left;color:var(--ink);min-height:44px}
.accmenu .am:hover,.accmenu .am:focus-visible{background:var(--soft)}
.accmenu .am.on{background:var(--acc-s)}
.accmenu em{font-style:normal;font-weight:700;font-size:13px;color:var(--ink2)}
.accmenu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.avatar{--c:var(--acc);width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar.lg{width:36px;height:36px;font-size:14px;margin-right:10px}
#bell.on{background:var(--acc-s);color:var(--acc-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Fiche latérale d'édition */

<script>
'use strict';
/* =====================================================================
   BUDGET — application de suivi des dépenses
   Organisation du code :
     1. Firebase            5. Synchro & sauvegardes
     2. Outils              6. Connexion & compte
     3. Données             7. Interface : briques communes
     4. Calculs             8. Écrans · 9. Fiche d'édition · 10. Événements
   ===================================================================== */

/* ============================== 1. FIREBASE ============================== */
const firebaseConfig = {
  apiKey: "AIzaSyAVfKgI_h4TpjmrSFIsbRRrTulOy672ywI",
  authDomain: "finance-budget-2026.firebaseapp.com",
  projectId: "finance-budget-2026",
  storageBucket: "finance-budget-2026.firebasestorage.app",
  messagingSenderId: "731092994652",
  appId: "1:731092994652:web:39de5d2fe7d8593abdb499"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
auth.languageCode = 'fr';
const db = firebase.firestore();
// Cache hors-ligne : l'app marche sans réseau et renvoie les modifications au retour de la connexion
db.enablePersistence({ synchronizeTabs: true }).catch(e => console.warn('Persistance hors-ligne indisponible :', e.code));
let currentUser = null;

/* ============================== 2. OUTILS ============================== */
const $ = id => document.getElementById(id);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => Number(v) || 0;
const eur = v => num(v).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
const eur0 = v => num(v).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '') + eur(Math.abs(v));
const minus = v => '−' + eur(Math.abs(v));
const eff = e => e.isDivided ? num(e.amount) / 2 : num(e.amount);       // part personnelle (½)
const sum = (a, f = x => num(x.amount)) => a.reduce((s, x) => s + f(x), 0);
const day = v => { const n = parseInt(v); return n >= 1 && n <= 31 ? String(n) : ''; };
const parseAmt = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmtIn = v => (v === '' || v == null) ? '' : String(Math.round(num(v) * 100) / 100).replace('.', ',');
const pct = (a, b) => b > 0 ? a / b * 100 : 0;
const MN = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const mkey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const nowK = () => mkey(new Date());
const keyDate = k => { const [y, m] = k.split('-'); return new Date(+y, +m - 1, 1); };
const shiftK = (k, n) => { const d = keyDate(k); d.setMonth(d.getMonth() + n); return mkey(d); };
const mlab = k => { const d = keyDate(k); return MN[d.getMonth()] + ' ' + d.getFullYear(); };
const mshort = k => { const d = keyDate(k); return MS[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2); };
const dim = k => { const d = keyDate(k); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };
const today = () => new Date().getDate();
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function daysLeft(k) { const n = nowK(); return k === n ? dim(k) - today() + 1 : k > n ? dim(k) : 0; }
function dayDate(k, d) { const x = keyDate(k); x.setDate(Math.min(d, dim(k))); return x; }
function shortDay(k, d) { return dayDate(k, d).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }); }
function dayLabel(k, d) {
  if (k === nowK()) { if (d === today()) return "Aujourd'hui"; if (d === today() - 1) return 'Hier'; }
  return cap(dayDate(k, d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }));
}
const cleanSite = s => String(s || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/[/?#].*$/, '');

/* ============================== 3. DONNÉES ==============================
   S = { categories, templates:{expenses,incomes,budgets}, months:{'AAAA-MM':{bankBalance,savingGoal,expenses,incomes,budgets}},
         savings (simulateur), savAcc (comptes d'épargne), alerts (seuils) }
   Un « modèle » (template) est une charge/recette/budget récurrent, recopié dans chaque nouveau mois.      */
const LS = 'budget_app_state';
const DC = ['Logement','Énergie','Assurance','Abonnement','Banque','Alimentation','Transport','Santé','Loisirs','Autre'];
const fresh = () => ({ categories: [...DC], templates: { expenses: [], incomes: [], budgets: [] }, months: {} });

function normalize(s) {
  s.categories = s.categories?.length ? s.categories : [...DC];
  s.templates = s.templates || {};
  ['expenses','incomes','budgets'].forEach(k => s.templates[k] = s.templates[k] || []);
  const fix = e => {
    const had = / \(Divisé par 2\)/.test(e.name || '');                  // ancien format
    if (e.isDivided && had) e.amount = e.originalAmount != null ? num(e.originalAmount) : num(e.amount) * 2;
    if (e.name !== undefined || e.cat === undefined) e.name = (e.name || '').replace(' (Divisé par 2)', '');
    e.isDivided = !!e.isDivided; e.date = day(e.date); e.amount = num(e.amount);
    if (!e.site) delete e.site; if (!e.img) delete e.img;
    delete e.originalAmount; delete e.hasReceipt;
  };
  Object.values(s.templates).forEach(a => a.forEach(t => { t.tmplId = t.tmplId || uid(); fix(t); }));
  s.months = s.months || {};
  Object.values(s.months).forEach(m => {
    const nz = v => (v === '' || v == null) ? null : num(v);
    m.bankBalance = nz(m.bankBalance); m.savingGoal = nz(m.savingGoal);
    m.expenses = m.expenses || []; m.incomes = m.incomes || [];
    m.budgets = m.budgets || JSON.parse(JSON.stringify(s.templates.budgets));
    [...m.expenses, ...m.incomes, ...m.budgets].forEach(x => { x.id = x.id || uid(); fix(x); });
    m.budgets.forEach(b => { delete b.name; delete b.date; delete b.isDivided; });
    [...m.expenses, ...m.incomes].forEach(x => {
      x.isFixed = !!x.isFixed;
      if (x.isFixed && !x.tmplId) { const t = s.templates[m.expenses.includes(x) ? 'expenses' : 'incomes'].find(t => t.name === x.name); x.tmplId = t ? t.tmplId : uid(); }
    });
  });
  s.templates.budgets.forEach(b => { delete b.name; delete b.date; delete b.isDivided; });
  return s;
}

let S = normalize(fresh());
let cur = new Date(); cur.setDate(1); cur.setHours(0, 0, 0, 0);
const ck = () => mkey(cur);

// Copie d'un modèle dans un mois
const inRange = (t, k) => (!t.from || k >= t.from) && (!t.until || k <= t.until);     // modèle limité dans le temps (ex. crédit)
const instance = (type, t) => ({ ...JSON.parse(JSON.stringify(t, (key, v) => key === 'from' || key === 'until' ? undefined : v)), id: uid(),
  ...(type === 'expenses' ? { status: 'Prévu', isFixed: true } : type === 'incomes' ? { status: 'En attente', isFixed: true } : {}) });

// Mois affiché. Créé à la volée à partir des modèles ; tant qu'il n'est pas modifié, c'est un « brouillon » non sauvegardé.
function month(k = ck()) {
  if (!S.months[k]) {
    const m = { bankBalance: null, savingGoal: null,
      expenses: S.templates.expenses.filter(t => inRange(t, k)).map(t => instance('expenses', t)),
      incomes: S.templates.incomes.filter(t => inRange(t, k)).map(t => instance('incomes', t)),
      budgets: S.templates.budgets.map(t => instance('budgets', t)) };
    Object.defineProperty(m, '_snap', { value: JSON.stringify(m), writable: true, configurable: true, enumerable: false });
    S.months[k] = m;
  }
  return S.months[k];
}
const isDraft = m => !!m && m._snap !== undefined && JSON.stringify(m) === m._snap;
const monthsFrom = k => Object.keys(S.months).filter(x => x >= k);

// Recopie des champs d'un modèle vers les mois ≥ fromKey (sauf éléments déjà payés / reçus)
function syncTpl(type, t, fields, fromKey = ck()) {
  monthsFrom(fromKey).forEach(k => {
    const l = S.months[k][type].find(x => x.tmplId === t.tmplId); if (!l) return;
    if (type !== 'budgets' && (l.status === 'Payé' || l.status === 'Reçu')) return;
    fields.forEach(f => { if (t[f] === undefined || t[f] === '') delete l[f]; else l[f] = t[f]; });
  });
}
function tplAdd(type, t, fromKey = ck()) {
  S.templates[type].push(t);
  monthsFrom(fromKey).filter(k => inRange(t, k)).forEach(k => S.months[k][type].push(instance(type, t)));
}
function tplDel(type, tmplId, fromKey = ck()) {
  S.templates[type] = S.templates[type].filter(t => t.tmplId !== tmplId);
  monthsFrom(fromKey).forEach(k => {
    const mm = S.months[k];
    mm[type] = mm[type].filter(y => {
      if (y.tmplId !== tmplId) return true;
      if (type !== 'budgets' && (y.status === 'Payé' || y.status === 'Reçu')) { y.isFixed = false; delete y.tmplId; return true; }
      return false;
    });
  });
}
const tplFields = type => type === 'expenses' ? ['name','amount','date','cat','isDivided','site','img'] : type === 'incomes' ? ['name','amount','date','site','img'] : ['cat','amount'];
function tplFrom(type, x) {
  const t = { tmplId: uid() };
  tplFields(type).forEach(f => { if (x[f] !== undefined && x[f] !== '') t[f] = x[f]; });
  return t;
}

// Catégorie déduite d'un libellé déjà utilisé
function autoCat(name) {
  const q = String(name || '').trim().toLowerCase(); if (q.length < 2) return null;
  for (const k of Object.keys(S.months).sort().reverse()) {
    const ex = S.months[k].expenses;
    for (let i = ex.length - 1; i >= 0; i--) if ((ex[i].name || '').trim().toLowerCase() === q && ex[i].cat) return ex[i].cat;
  }
  const t = S.templates.expenses.find(t => (t.name || '').trim().toLowerCase() === q);
  return t ? t.cat : null;
}
const isPaid = (x, type) => type === 'incomes' ? x.status === 'Reçu' : x.status === 'Payé';

/* ============================== 4. CALCULS ============================== */
const vspent = (m, c) => sum(m.expenses.filter(e => !e.isFixed && e.cat === c), eff);

// Variation du compte sur un mois : réelle pour les mois passés, projetée pour le mois en cours et les suivants
function monthFlow(m, key) {
  if (key < nowK())
    return sum(m.incomes.filter(i => i.status === 'Reçu')) - sum(m.expenses.filter(e => e.status === 'Payé'), eff) - num(m.savingGoal);
  return sum(m.incomes) - sum(m.expenses, eff) - num(m.savingGoal) - varRest(m, key).v;
}
// Dépenses du quotidien (hors charges fixes et virements entre mes comptes)
const isDaily = e => !e.isFixed && e.xfer?.kind !== 'acc';
// Ce que tu dépenses d'habitude APRÈS le jour « from » (6 derniers mois terminés) → moyenne, écart, nombre de mois
let histCache = { sig: '', r: {} };
function histVar(from) {
  const ks = Object.keys(S.months).filter(x => x < nowK() && !isDraft(S.months[x]) && S.months[x].expenses.some(isDaily)).sort().slice(-6);
  const sig = ks.map(x => x + ':' + S.months[x].expenses.length + ':' + sum(S.months[x].expenses, eff)).join('|');
  if (histCache.sig !== sig) histCache = { sig, r: {} };
  if (histCache.r[from]) return histCache.r[from];
  const vals = ks.map(x => { const D = dim(x); return sum(S.months[x].expenses.filter(isDaily), e => { const d = parseInt(e.date); return eff(e) * (d ? (d > from ? 1 : 0) : Math.max(0, (D - from) / D)); }); });
  const n = vals.length, mean = n ? vals.reduce((s, v) => s + v, 0) / n : 0;
  const sd = n > 1 ? Math.sqrt(vals.reduce((s, v) => s + (v - mean) ** 2, 0) / (n - 1)) : mean * .3;
  return histCache.r[from] = { mean, sd, n };
}
// Dépenses du quotidien encore à prévoir ce mois-ci, d'après l'historique (déduction faite de celles déjà saisies pour plus tard)
function varRest(m, key) {
  const cur = key === nowK(), from = cur ? today() : 0, h = histVar(from);
  if (!h.n) return { v: 0, sd: 0, n: 0, h, from };
  const ahead = sum(m.expenses.filter(e => isDaily(e) && (!cur || (e.status !== 'Payé' && parseInt(e.date) > from))), eff);
  return { v: Math.max(0, h.mean - ahead), sd: h.sd, n: h.n, h, from, ahead };
}
// Solde au 1er du mois : dernier solde réel saisi (ce mois-ci ou avant) + variations des mois intermédiaires
function chainBalance(targetKey) {
  let bal = 0;
  for (const key of Object.keys(S.months).sort()) {
    if (key > targetKey) break;
    const m = S.months[key];
    if (m.bankBalance != null) bal = num(m.bankBalance);
    if (key === targetKey) return bal;
    bal += monthFlow(m, key);
  }
  return bal;
}
function calc(m, key) {
  const ex = m.expenses, inc = m.incomes, fx = ex.filter(e => e.isFixed), vr = ex.filter(e => !e.isFixed);
  const bcats = new Set(m.budgets.map(b => b.cat));
  const r = {
    incAll: sum(inc), incIn: sum(inc.filter(i => i.status === 'Reçu')),
    outAll: sum(ex, eff), outPaid: sum(ex.filter(e => e.status === 'Payé'), eff), outPlan: sum(ex.filter(e => e.status !== 'Payé'), eff),
    fixAll: sum(fx, eff), fixPaid: sum(fx.filter(e => e.status === 'Payé'), eff),
    varAll: sum(vr, eff),
    budAll: sum(m.budgets),
    budLeft: sum(m.budgets, b => Math.max(0, num(b.amount) - vspent(m, b.cat))),
    budEff: sum(m.budgets, b => Math.max(num(b.amount), vspent(m, b.cat))),   // budget, ou dépensé s'il est dépassé
    varOut: sum(vr.filter(e => !bcats.has(e.cat) && e.xfer?.kind !== 'acc'), eff),   // dépenses variables hors budget
    xferOut: sum(vr.filter(e => e.xfer?.kind === 'acc'), eff),                   // virements vers mes autres comptes
    saving: num(m.savingGoal)
  };
  r.fixLeft = r.fixAll - r.fixPaid;
  r.spent = r.fixPaid + r.varAll;
  r.planned = r.fixAll + r.budAll + r.varOut + r.xferOut;
  r.free = r.incAll - r.fixAll - r.budEff - r.varOut - r.xferOut - r.saving;              // part des recettes non affectée (écran Budgets)
  r.init = chainBalance(key);
  r.bankSet = m.bankBalance != null;
  r.current = r.init + r.incIn - r.outPaid;
  r.flow = monthFlow(m, key);
  r.est = r.init + r.flow;
  r.past = key < nowK();
  r.vr = r.past ? null : varRest(m, key);                                         // dépenses habituelles encore à venir
  r.incWait = r.incAll - r.incIn;
  // Reste à vivre = solde actuel + recettes à venir − dépenses à payer − épargne prévue
  // (= ce qu'il restera fin de mois si tu ne dépenses plus rien ; les budgets se dépensent dedans)
  r.rav = r.past ? r.est : r.current + r.incWait - r.outPlan - r.saving;
  r.left = daysLeft(key);
  r.perDay = r.left > 0 ? Math.max(0, r.rav) / r.left : null;
  return r;
}
// Dépenses réellement engagées par catégorie (charges fixes payées + variables)
function catTotals(m) {
  const o = {};
  m.expenses.forEach(e => { const v = eff(e); if (v <= 0 || (e.isFixed && e.status !== 'Payé') || e.xfer?.kind === 'acc') return; o[e.cat] = (o[e.cat] || 0) + v; });
  return o;
}
// État d'une échéance : ok (réglée) / late (date passée) / plan (à venir)
function dueState(x, type, k) {
  if (isPaid(x, type)) return 'ok';
  const d = parseInt(x.date), n = nowK();
  if (k < n) return 'late';
  if (k === n && d && d < today()) return 'late';
  if (k === n && d && d === today()) return 'due';
  return 'plan';
}

/* ---------- Alertes ---------- */
const AL = () => { const A = S.alerts = S.alerts || {}; if (A.thr === undefined) A.thr = 0; if (A.pct === undefined) A.pct = 20; if (!Array.isArray(S.alerts.custom)) S.alerts.custom = []; return S.alerts; };
// Alertes personnalisées : catégorie, solde, grosse dépense, recette attendue, rappel
const ALT = {
  cat: { l: 'Une catégorie dépasse un montant', ic: 'pie' },
  bal: { l: 'Le solde passe sous un montant', ic: 'wallet' },
  big: { l: 'Une dépense dépasse un montant', ic: 'warn' },
  inc: { l: 'Une recette n\'est pas arrivée à une date', ic: 'trend' },
  rem: { l: 'Un rappel à une date du mois', ic: 'bell' }
};
function altLabel(a) {
  return a.t === 'cat' ? `${a.cat} dépasse ${eur0(a.amt)} dans le mois` : a.t === 'bal' ? `Solde actuel sous ${eur0(a.amt)}` : a.t === 'big' ? `Une dépense de plus de ${eur0(a.amt)}`
    : a.t === 'inc' ? `« ${a.name} » pas reçu le ${a.day}` : a.t === 'rem' ? `Le ${a.day} : ${a.text}` : '';
}
function customAlerts(m, k, c) {
  const o = [], cur = k === nowK(), td = today(), ct = catTotals(m);
  AL().custom.filter(a => a.on !== false).forEach(a => {
    const id = a.id;
    if (a.t === 'cat') { const v = ct[a.cat] || 0, q = num(a.amt); if (q > 0 && v > q) o.push({ id, lvl: 'bad', text: `${a.cat} : ${eur(v)} ce mois (ta limite : ${eur0(q)})`, go: 'mouvements', q: a.cat }); else if (q > 0 && v > q * .9) o.push({ id: id + '_90', lvl: 'warn', text: `${a.cat} : ${eur(v)}, bientôt ta limite de ${eur0(q)}`, go: 'mouvements', q: a.cat }); }
    if (a.t === 'bal' && cur && c.current < num(a.amt)) o.push({ id, lvl: 'bad', text: `Solde actuel ${eur(c.current)} : sous ton seuil de ${eur0(a.amt)}`, go: 'accueil' });
    if (a.t === 'big') m.expenses.filter(e => !e.isFixed && eff(e) > num(a.amt)).forEach(e => o.push({ id: id + '_' + e.id, lvl: 'warn', text: `Grosse dépense : ${e.name || e.cat} · ${eur(eff(e))}`, go: 'mouvements', q: e.name || e.cat }));
    if (a.t === 'inc' && (k < nowK() || (cur && td >= +a.day))) { const q = String(a.name || '').toLowerCase(); if (q && !m.incomes.some(i => i.status === 'Reçu' && String(i.name || '').toLowerCase().includes(q))) o.push({ id, lvl: 'bad', text: `« ${a.name} » toujours pas reçu (attendu le ${a.day})`, go: 'mouvements', q: a.name }); }
    if (a.t === 'rem' && cur && td >= +a.day && td <= +a.day + 2) o.push({ id: id + '_' + k, lvl: 'warn', text: '🔔 ' + a.text, go: 'accueil' });
  });
  return o;
}
function alerts(k = ck()) {
  const m = S.months[k], o = []; if (!m) return o;
  const c = calc(m, k), A = AL();
  if (k === nowK()) {
    const late = m.expenses.filter(e => e.isFixed && dueState(e, 'expenses', k) === 'late');
    if (late.length) o.push({ lvl: 'bad', text: `${late.length} charge${late.length > 1 ? 's' : ''} fixe${late.length > 1 ? 's' : ''} en retard · ${eur(sum(late, eff))}`, go: 'mouvements', flt: 'todo' });
  }
  o.push(...customAlerts(m, k, c));
  if (!c.past && c.est < num(A.thr)) o.push({ lvl: 'bad', text: `Fin de mois estimée : ${eur(c.est)} (seuil ${eur(A.thr)})`, go: 'accueil' });
  if (!c.past && c.rav < 0) o.push({ lvl: 'bad', text: `Reste à vivre négatif : ${eur(c.rav)}`, go: 'accueil' });
  m.budgets.forEach(b => {
    const s = vspent(m, b.cat), q = num(b.amount);
    if (q > 0 && s > q) o.push({ lvl: 'bad', text: `Budget ${b.cat} dépassé de ${eur(s - q)}`, go: 'budgets' });
    else if (q > 0 && s > q * .85) o.push({ lvl: 'warn', text: `Budget ${b.cat} presque atteint : ${eur(s)} sur ${eur(q)}`, go: 'budgets' });
  });
  const pv = Object.keys(S.months).sort().filter(x => x < k && !isDraft(S.months[x])).slice(-3);
  if (pv.length) {
    const n = catTotals(m), ps = pv.map(x => catTotals(S.months[x]));
    Object.entries(n).forEach(([cat, v]) => {
      const av = ps.reduce((s, q) => s + (q[cat] || 0), 0) / pv.length;
      if (av > 20 && v > av * (1 + num(A.pct) / 100))
        o.push({ lvl: 'warn', text: `${cat} : ${eur(v)}, soit +${Math.round((v / av - 1) * 100)} % par rapport à la moyenne`, go: 'mouvements', q: cat });
    });
  }
  return o.sort((a, b) => (a.lvl === 'bad' ? 0 : 1) - (b.lvl === 'bad' ? 0 : 1));
}

/* ============================== 5. COMPTES, SYNCHRO & SAUVEGARDES ==============================
   Firestore :
     users/{uid}                    profil : email, liste des comptes, dernières lectures (messagerie)
     accounts/{id}                  un compte bancaire : nom, banque, membres, réglages (meta), résumé
     accounts/{id}/months/{AAAA-MM} un document par mois (mouvements, budgets, solde du 1er…)
     accounts/{id}/activity/…       journal des modifications (comptes partagés)
     accounts/{id}/backups/…        sauvegardes automatiques
     invites/{compte}_{email}       invitations à rejoindre un compte
   Chaque modification n'envoie que les mois changés. Si quelqu'un d'autre a modifié le même mois
   entre-temps, les deux versions sont fusionnées élément par élément (rien n'est écrasé).            */
const FV = firebase.firestore.FieldValue;
const accDoc = id => db.collection('accounts').doc(id);
const monthCol = id => accDoc(id).collection('months');
const userDoc = (u = currentUser.uid) => db.collection('users').doc(u);
const legacyDoc = (u = currentUser.uid) => userDoc(u).collection('data').doc('budget');
const myEmail = () => String(currentUser?.email || '').toLowerCase();

let loaded = false;                 // compte actif chargé
let ACC = {};                       // comptes connus : id -> document (nom, banque, membres, résumé…)
let accIds = [];                    // comptes de l'utilisateur, dans l'ordre
let active = null;                  // compte affiché
let USER = null;                    // document users/{uid}
let subs = [], accSubs = [], listSubs = {}, actSubs = {};
let base = {}, sent = {};           // par clé ('meta' ou 'AAAA-MM') : dernière version serveur intégrée / dernière envoyée
let saveTimer = null, synced = false, migrating = false, startedAt = 0;
let INV = { in: [], out: [] }, ACT = {}, XF = { in: [], out: [] };
// Épargne personnelle (comptes d'épargne simples, simulateur, choix d'inclusion) : rattachée à l'utilisateur, pas à un compte
let U = { savAcc: [], savings: null, savIncl: {} }, userSaveTimer = null;
function loadU(d) { if (userSaveTimer) return; U = { savAcc: (d && d.savAcc) || [], savings: (d && d.savings) || null, savIncl: (d && d.savIncl) || {}, contacts: (d && d.contacts) || [], recvAcc: (d && d.recvAcc) || null, recvHide: (d && d.recvHide) || [], xfHide: (d && d.xfHide) || [], xfAcc: (d && d.xfAcc) || {}, goals: (d && d.goals) || [] }; publishDir(); }
function saveUser() {
  if (!currentUser) return; clearTimeout(userSaveTimer);
  userSaveTimer = setTimeout(() => { userSaveTimer = null; userDoc().set({ savAcc: U.savAcc, savings: U.savings, savIncl: U.savIncl, contacts: U.contacts || [], recvAcc: U.recvAcc || null, recvHide: U.recvHide || [], xfHide: (U.xfHide || []).slice(-300), xfAcc: U.xfAcc || {}, goals: U.goals || [] }, { merge: true }).catch(e => toast('⚠ Épargne non enregistrée (' + (e.code || 'erreur') + ')')); }, 600);
}
const isSavAcc = (id = active) => ACC[id]?.kind === 'epargne';
// La session affichée est-elle toujours celle de l'utilisateur connecté ? (autre onglet connecté avec un autre compte)
const sameUser = () => !!currentUser && !!auth.currentUser && auth.currentUser.uid === currentUser.uid;
const isShared = (id = active) => (ACC[id]?.members || []).length > 1;
const accName = (id = active) => ACC[id]?.name || 'Compte';

/* ---------- Découpage des données : réglages + un bloc par mois ---------- */
// Texte canonique (clés triées) : deux versions identiques donnent toujours le même texte, sur tous les appareils
const sortKeys = o => Array.isArray(o) ? o.map(sortKeys) : (o && typeof o === 'object') ? Object.keys(o).sort().reduce((r, k) => (r[k] = sortKeys(o[k]), r), {}) : o;
const canon = o => JSON.stringify(sortKeys(o));
function metaOf(s) { const o = {}; Object.keys(s).forEach(k => { if (k !== 'months') o[k] = s[k]; }); return canon(o); }
function parts() {
  const p = { meta: metaOf(S) };
  for (const [k, m] of Object.entries(S.months)) {
    if (m._snap !== undefined) { if (JSON.stringify(m) === m._snap) continue; delete m._snap; }   // mois seulement consulté
    p[k] = canon(m);
  }
  return p;
}
function snapshot() {
  const p = parts(), o = JSON.parse(p.meta); o.months = {};
  Object.keys(p).sort().forEach(k => { if (k !== 'meta') o.months[k] = JSON.parse(p[k]); });
  return JSON.stringify(o);
}

/* ---------- Fusion de deux versions (base commune, la mienne, la distante) ---------- */
const J = s => s ? JSON.parse(s) : null;
const js = x => JSON.stringify(x);
function mergeList(b = [], l = [], r = [], key = 'id') {
  const bm = new Map(b.map(x => [x[key], js(x)])), lm = new Map(l.map(x => [x[key], x])), rm = new Map(r.map(x => [x[key], x]));
  const out = [];
  r.forEach(x => {
    const id = x[key], bx = bm.get(id), lx = lm.get(id), rs = js(x);
    if (!lx) { if (bx !== undefined && bx === rs) return; out.push(x); return; }        // supprimé chez moi
    out.push(js(lx) !== bx && rs === bx ? lx : x);                                       // modifié seulement chez moi
  });
  l.forEach((x, i) => { const id = x[key]; if (rm.has(id) || bm.has(id)) return; i === 0 ? out.unshift(x) : out.push(x); });  // ajouts
  return out;
}
const pick = (b, l, r) => js(l) !== js(b) ? l : r;
function mergeMonth(b, l, r) {
  b = b || {}; const o = Object.assign({}, r);
  ['expenses','incomes','budgets'].forEach(f => o[f] = mergeList(b[f], l[f], r[f]));
  ['bankBalance','savingGoal'].forEach(f => o[f] = pick(b[f], l[f], r[f]));
  return o;
}
function mergeMeta(b, l, r) {
  b = b || {}; const o = Object.assign({}, r);
  const bc = new Set(b.categories || []), lc = l.categories || [];
  o.categories = (r.categories || []).filter(c => !(bc.has(c) && !lc.includes(c))).concat(lc.filter(c => !bc.has(c) && !(r.categories || []).includes(c)));
  o.templates = {}; ['expenses','incomes','budgets'].forEach(t => o.templates[t] = mergeList(b.templates?.[t], l.templates?.[t], r.templates?.[t], 'tmplId'));
  o.savAcc = mergeList(b.savAcc, l.savAcc, r.savAcc);
  if (b.loans || l.loans || r.loans) o.loans = mergeList(b.loans, l.loans, r.loans);
  ['savings','alerts','goal'].forEach(f => { const v = pick(b[f], l[f], r[f]); if (v === undefined) delete o[f]; else o[f] = v; });
  return o;
}

/* ---------- Envoi ---------- */
function save() {
  if (!currentUser || !loaded || !active) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushCloud, 800);                     // regroupe les modifications rapprochées
}
function summaryOf() {
  const k = nowK(), c = calc(month(k), k);
  return { k, current: Math.round(c.current * 100) / 100, est: Math.round(c.est * 100) / 100, rav: Math.round(c.rav * 100) / 100 };
}
let allowDeletes = false;   // vrai seulement juste après une réinitialisation, une restauration ou un import
function pushCloud() {
  saveTimer = null;
  if (!currentUser || !loaded || !active || !sameUser()) return Promise.resolve();
  const id = active, p = parts(), batch = db.batch(), now = Date.now(), me = currentUser.uid;
  let n = 0, waiting = false;
  for (const [k, v] of Object.entries(p)) {
    if (sent[k] === v) continue;
    if (k === 'meta') { n++; continue; }                       // réglages : envoyés avec le document du compte
    if (k !== 'meta' && base[k] === undefined && !synced) { waiting = true; continue; }   // mois pas encore reçu du serveur : on attend
    sent[k] = v; n++;
    batch.set(monthCol(id).doc(k), { data: v, updatedAt: now, updatedBy: me });
  }
  if (allowDeletes) Object.keys(sent).filter(k => k !== 'meta' && !(k in p)).forEach(k => { batch.delete(monthCol(id).doc(k)); delete sent[k]; delete base[k]; n++; });
  allowDeletes = false;
  if (!n) { if (waiting) saveTimer = setTimeout(pushCloud, 1500); return Promise.resolve(); }
  const upd = { summary: summaryOf(), updatedAt: now, updatedBy: me };
  if (sent.meta !== p.meta) { upd.meta = p.meta; sent.meta = p.meta; }
  batch.update(accDoc(id), upd);
  if (waiting) saveTimer = setTimeout(pushCloud, 1500);

// Intègre une version distante d'une clé ; renvoie true si l'affichage doit changer
function onRemote(key, R) {
  if (R == null) return false;
  if (R === sent[key]) { base[key] = R; return false; }        // écho de notre propre envoi
  const curStr = key === 'meta' ? metaOf(S) : (S.months[key] && !isDraft(S.months[key]) ? canon(S.months[key]) : null);
  let next = R;
  if (curStr != null && curStr !== base[key] && curStr !== R)
    next = canon(key === 'meta' ? mergeMeta(J(base[key]), J(curStr), J(R)) : mergeMonth(J(base[key]), J(curStr), J(R)));
  if (key === 'meta') { const o = JSON.parse(next); o.months = S.months; S = normalize(o); }
  else { S.months[key] = JSON.parse(next); S = normalize(S); }
  const norm = key === 'meta' ? metaOf(S) : canon(S.months[key]);
  if (next === R) { base[key] = sent[key] = norm; }
  else { base[key] = R; sent[key] = undefined; save(); }        // version fusionnée à renvoyer
  return true;
}

  clearTimeout(userSaveTimer); userSaveTimer = null; U = { savAcc: [], savings: null, savIncl: {} };
}

// Ouvre un compte : réglages + tous ses mois, puis écoute les modifications
function openAccount(id) {
  if (!id) return;

  stopAccount(); closePanel(true);
  active = id; undoSnap = null; UI.calDay = null;
  try { localStorage.setItem('acc_' + currentUser.uid, id); } catch (e) {}
  if ($('app').hidden) showScreen('loading');
  let meta = null, gotMeta = false, gotMonths = false, months = {};
  const start = () => {
    if (loaded || !gotMeta || !gotMonths || active !== id) return;
    const o = meta ? JSON.parse(meta) : fresh(); o.months = {};
    Object.entries(months).forEach(([k, v]) => { o.months[k] = JSON.parse(v); });
    S = normalize(o);
    Object.keys(months).forEach(k => { base[k] = sent[k] = canon(S.months[k]); });   // versions normalisées : pas de réécriture inutile
    if (meta) base.meta = sent.meta = metaOf(S);
    loaded = true;
    // Ancienne épargne stockée dans le compte → déplacée vers l'utilisateur (une seule fois)
    if ((S.savAcc || []).length || S.savings) {
      const have = new Set(U.savAcc.map(a => a.id)); (S.savAcc || []).forEach(a => { if (!have.has(a.id)) U.savAcc.push(a); });
      if (S.savings && !U.savings) U.savings = S.savings;
      delete S.savAcc; delete S.savings; saveUser(); save();
    }
    if (UI.view === 'budgets' && isSavAcc(id)) UI.view = 'accueil';
    showScreen('app'); render();
    if (!meta) save();
    setTimeout(() => { if (active === id && loaded) { dailyBackup(); const s = summaryOf(); if (js(s) !== js(ACC[id]?.summary)) accDoc(id).update({ summary: s }).catch(() => {}); } }, 1500);
  };
  accSubs.push(accDoc(id).onSnapshot({ includeMetadataChanges: true }, d => {
    if (!d.exists) { if (!d.metadata.fromCache) accountGone(id); return; }
    ACC[id] = d.data();
    if (d.metadata.hasPendingWrites) return;
    if (!loaded) { meta = d.data().meta || null; gotMeta = true; return start(); }
    if (onRemote('meta', d.data().meta || null)) remoteToast(d.data().updatedBy); else renderChrome();
  }, err => { console.error(err); accountGone(id); }));
  accSubs.push(monthCol(id).onSnapshot({ includeMetadataChanges: true }, q => {
    if (!q.metadata.fromCache && !synced) { synced = true; }
    if (!loaded) { q.docs.forEach(d => months[d.id] = d.data().data); gotMonths = true; return start(); }
    let ch = false, by = null;
    q.docChanges().forEach(c => {
      if (c.doc.metadata.hasPendingWrites) return;
      if (c.type === 'removed' && q.metadata.fromCache) return;
      const k = c.doc.id;
      if (c.type === 'removed') { if (sent[k] !== undefined) { delete S.months[k]; delete sent[k]; delete base[k]; ch = true; } return; }
      if (onRemote(k, c.doc.data().data)) { ch = true; by = c.doc.data().updatedBy; }
    });

  }, err => console.error(err)));
}

// Regroupe les mouvements par jour (« À venir » en tête pour le mois en cours)
function groups(m, k, flt, q) {
  const isCur = k === nowK(), td = today();
  let items = [...m.expenses.map(x => [x, 'expenses']), ...m.incomes.map(x => [x, 'incomes'])];
  items = items.filter(([x, t]) => {
    if (flt === 'todo' && !(t === 'expenses' && x.status !== 'Payé')) return false;
    if (flt === 'fixed' && !x.isFixed) return false;
    if (flt === 'var' && (x.isFixed || t !== 'expenses')) return false;
    if (flt === 'inc' && t !== 'incomes') return false;
    if (q && !((x.name || '') + ' ' + (x.cat || '')).toLowerCase().includes(q)) return false;
    return true;
  });
  const G = new Map(), add = (key, label, ord, it) => { if (!G.has(key)) G.set(key, { key, label, ord, items: [] }); G.get(key).items.push(it); };
  items.forEach(it => {
    const [x, t] = it, d = parseInt(x.date) || 0;
    if (isCur && !isPaid(x, t) && (d > td || !d)) add('next', 'À venir', -1, it);
    else if (d) add('d' + d, dayLabel(k, d), k > nowK() ? d : 100 - d, it);
    else add('nd', 'Sans date', 999, it);
  });
  const out = [...G.values()].sort((a, b) => a.ord - b.ord);
  const nx = out.find(g => g.key === 'next'); if (nx) nx.items.sort((a, b) => (parseInt(a[0].date) || 99) - (parseInt(b[0].date) || 99));
  return out;
}

/* ---------- ÉPARGNE ---------- */
const AT = { 'Livret A': ['#14B8A6','bank'], 'LDDS': ['#10B981','sprout'], 'LEP': ['#84CC16','coin'], 'PEL': ['#6366F1','home'], 'PEA': ['#8B5CF6','trend'],
  'Assurance-vie': ['#0EA5E9','shield'], 'CTO': ['#A855F7','trend'], 'Crypto': ['#F59E0B','coin'], 'Autre': ['#94A3B8','tag'] };
const accs = () => U.savAcc = U.savAcc || [];
const aBal = (a, k = nowK()) => { const ks = Object.keys(a.hist || {}).sort().filter(x => x <= k); return ks.length ? num(a.hist[ks[ks.length - 1]]) : 0; };
const aLast = a => { const ks = Object.keys(a.hist || {}).sort(); return ks.length ? ks[ks.length - 1] : null; };
const svD = () => ({ capital: 0, monthly: 200, mode: 'fix', salary: 0, salGrowth: 2, pct: 10, raise: 0, bonus: 0, rate: 4, infl: 2, years: 20, goal: 50000 });
const sv = () => U.savings = Object.assign(svD(), U.savings || {});

// Simulation mois par mois (versements en fin de mois, intérêts composés mensuellement)
function svSim(p, r, base) {
  const mr = Math.pow(1 + r / 100, 1 / 12) - 1, N = Math.max(1, Math.round(num(p.years))) * 12;
  let capi = num(p.capital), cv = 0, gm = null, d1 = 0; const rows = [{ y: 0, cap: capi, cv: 0 }];
  for (let i = 1; i <= N; i++) {
    const yi = Math.floor((i - 1) / 12);
    const d = base != null ? base * Math.pow(1 + num(p.raise) / 100, yi)
      : p.mode === 'pct' ? num(p.salary) * Math.pow(1 + num(p.salGrowth) / 100, yi) * num(p.pct) / 100
      : num(p.monthly) * Math.pow(1 + num(p.raise) / 100, yi);
    if (i === 1) d1 = d;
    capi = capi * (1 + mr) + d; cv += d;
    if (i % 12 === 0) { capi += num(p.bonus); cv += num(p.bonus); }
    if (gm == null && num(p.goal) > 0 && capi >= num(p.goal)) gm = i;
    if (i % 12 === 0) rows.push({ y: i / 12, cap: capi, cv });
  }
  return { rows, cap: capi, cv, gm, d1 };
}
const gmTxt = gm => { const y = Math.floor(gm / 12), mo = gm % 12; return [y ? y + ' an' + (y > 1 ? 's' : '') : '', mo ? mo + ' mois' : ''].filter(Boolean).join(' '); };

// Comptes bancaires de type Épargne (dont les comptes partagés) et choix de les compter dans mon épargne
const savBankIds = () => accIds.filter(id => ACC[id] && isSavAcc(id));
const savIncluded = id => U.savIncl[id] !== false;
function vEpargne() {
  const V = $('v-epargne'), A = accs(), p = sv(), m = month(nowK());

  return ks.map(k => { const m = S.months[k], c = calc(m, k);
    return { k, m, inc: c.incAll, out: c.outAll, sav: c.saving, net: c.incAll - c.outAll, tx: c.incAll > 0 ? (c.incAll - c.outAll) / c.incAll * 100 : null, start: c.init, end: c.est, cur: k === nk }; });
}

  } catch (e) { console.warn('Réception virement', e.code || e.message); }
  finally { xfBusy.delete(t.id); }
}

/* ============================== DEVISES ==============================
   Taux de change : Banque centrale européenne (via frankfurter), gratuit, mis à jour chaque jour ouvré vers 16 h.
   Une dépense saisie en devise est convertie en € au taux du jour ; le montant d'origine est gardé.          */
const CURS = ['EUR', 'USD', 'GBP', 'CHF', 'CAD', 'JPY', 'AUD', 'CNY', 'SEK', 'NOK', 'DKK', 'PLN', 'CZK', 'HUF', 'TRY', 'BRL', 'MXN', 'INR', 'THB', 'ZAR'];
let FX = (() => { try { return JSON.parse(localStorage.getItem('fx') || 'null'); } catch (e) { return null; } })();   // { date, at, rates } (1 € = rates[X] X)
let fxBusy = null;
function fxLoad(force) {
  if (!force && FX && Date.now() - FX.at < 6 * 3600e3) return Promise.resolve(FX);
  if (fxBusy) return fxBusy;
  const urls = ['https://api.frankfurter.dev/v1/latest?base=EUR', 'https://api.frankfurter.app/latest?from=EUR'];
  const tryU = i => Promise.resolve().then(() => fetch(urls[i])).then(r => { if (!r.ok) throw 0; return r.json(); }).catch(e => { if (i + 1 < urls.length) return tryU(i + 1); throw e; });
  return fxBusy = tryU(0).then(j => { FX = { date: j.date, at: Date.now(), rates: Object.assign({ EUR: 1 }, j.rates) }; try { localStorage.setItem('fx', JSON.stringify(FX)); } catch (e) {} return FX; })
    .catch(() => FX).finally(() => { fxBusy = null; });
}
const fxRate = c => c === 'EUR' ? 1 : FX?.rates?.[c] || null;           // nombre d'unités de « c » pour 1 €
const fxFmt = (v, c) => { try { return num(v).toLocaleString('fr-FR', { style: 'currency', currency: c }); } catch (e) { return num(v) + ' ' + c; } };
const fxDate = () => FX?.date ? FX.date.split('-').reverse().slice(0, 2).join('/') : '';
function fxLine() {
  if (!P || !P.cur || P.cur === 'EUR') return '';
  const a = parseAmt(P.d.amount), r = fxRate(P.cur);
  if (!r) return `<span style="color:var(--warn)">${fxBusy ? 'Chargement du taux…' : 'Taux indisponible (pas de connexion ?)'}</span>`;
  return `≈ <b class="num">${eur(a / r)}</b> · 1 ${P.cur} = ${(1 / r).toLocaleString('fr-FR', { maximumFractionDigits: 4 })} € <span style="color:var(--mute)">(BCE, ${fxDate()})</span>`;
}
function fxSelectHTML() {
  if (isSavAcc() || P.d.xfer) return '';
  const list = CURS.filter(c => c === 'EUR' || !FX || FX.rates[c]);
  return `<div class="fxrow"><label class="fxsel">Devise<select data-pcur="1" aria-label="Devise">${list.map(c => `<option ${c === (P.cur || 'EUR') ? 'selected' : ''}>${c}</option>`).join('')}</select></label><span id="pn-fx" class="note" style="font-size:13px">${fxLine()}</span></div>`;
}
function fxPaint() { const e = $('pn-fx'); if (e) e.innerHTML = fxLine(); }

/* ============================== CRÉDITS ==============================
   Rattachés au compte bancaire qui paie la mensualité (partagés avec ses membres).
   Mensualité calculée (prêt amortissable à taux fixe) + assurance ; ajoutée aux charges fixes jusqu'à la dernière échéance. */
const LOAN_KINDS = { immo: ['Immobilier', 'home'], auto: ['Auto / moto', 'bus'], conso: ['Consommation', 'cart'], etud: ['Étudiant', 'leaf'], travaux: ['Travaux', 'tag'], autre: ['Autre', 'bank'] };
const loans = () => S.loans = S.loans || [];
const kAdd = (k, n) => { const d = keyDate(k); d.setMonth(d.getMonth() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const kDiff = (a, b) => { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); };
function loanCalc(l, atK = nowK()) {
  const C = num(l.capital), n = Math.max(1, Math.round(num(l.months))), r = num(l.rate) / 1200, ins = num(l.ins);
  const M = num(l.pay) > 0 ? num(l.pay) : r ? C * r / (1 - Math.pow(1 + r, -n)) : C / n;
  const rem = k => { if (k <= 0) return C; if (k >= n) return 0; return r ? Math.max(0, C * Math.pow(1 + r, k) - M * (Math.pow(1 + r, k) - 1) / r) : Math.max(0, C - M * k); };
  const paid = Math.min(n, Math.max(0, kDiff(l.start, atK) + 1)), left = rem(paid);
  const interest = Math.max(0, M * n - C), interestPaid = Math.max(0, M * paid - (C - left));
  return { C, n, r, M, ins, total: M + ins, rem, paid, left, interest, interestPaid, insTotal: ins * n, cost: interest + ins * n, end: kAdd(l.start, n - 1), p: C > 0 ? (C - left) / C * 100 : 0 };
}
function loanTplSync(l, k = nowK()) {
  const c = loanCalc(l), name = (LOAN_KINDS[l.kind]?.[0] ? 'Crédit ' : '') + l.name;
  const t = S.templates.expenses.find(x => x.tmplId === l.tmplId);
  const fields = { name, amount: Math.round(c.total * 100) / 100, date: String(l.day || ''), cat: S.categories.includes('Banque') ? 'Banque' : 'Autre', from: l.start, until: c.end, loan: l.id };
  if (l.site) fields.site = l.site;
  if (!l.fixed) { if (t) tplDel('expenses', t.tmplId, k); delete l.tmplId; return; }
  if (t) { Object.assign(t, fields); if (!l.site) delete t.site; monthsFrom(k).forEach(mk => { const mm = S.months[mk], has = mm.expenses.find(x => x.tmplId === t.tmplId), inR = mk >= l.start && mk <= c.end;
      if (has && !inR && has.status !== 'Payé') mm.expenses = mm.expenses.filter(x => x !== has); else if (!has && inR) mm.expenses.push(instance('expenses', t)); });
    syncTpl('expenses', t, ['name', 'amount', 'date', 'cat', 'site'], k); }
  else { const nt = Object.assign({ tmplId: uid(), isDivided: false }, fields); l.tmplId = nt.tmplId; tplAdd('expenses', nt, k); }
}
function loansHTML() {
  if (isSavAcc()) return '';
  const L = loans(), cs = L.map(l => [l, loanCalc(l)]), active = cs.filter(([, c]) => c.left > 0);
  return `<section class="card" aria-label="Mes crédits" style="display:flex;flex-direction:column;gap:2px">
    <div class="ch"><h2>Mes crédits ${tip('crédits', 'Mes crédits', 'Les prêts remboursés depuis « ' + esc(accName()) + ' ». La mensualité (avec assurance) peut être ajoutée automatiquement aux charges fixes, jusqu\'à la dernière échéance. Calcul pour un prêt classique à taux fixe : vérifie avec ton tableau d\'amortissement.', 'rt')}</h2><button class="btn sm" data-a="loan-new">${svg('plus', 16)} Crédit</button></div>
    ${active.length ? `<div class="tiles ltot" style="margin:4px 0 10px"><div class="kp" style="box-shadow:none;background:var(--soft)"><span>Reste à rembourser</span><b class="num">${eur(sum(active, ([, c]) => c.left))}</b></div><div class="kp" style="box-shadow:none;background:var(--soft)"><span>Mensualités</span><b class="num">${eur(sum(active, ([, c]) => c.total))}</b><small>par mois, assurance comprise</small></div></div>` : ''}
    ${cs.map(([l, c]) => { const [kl, ic] = LOAN_KINDS[l.kind] || LOAN_KINDS.autre, done = c.left <= 0, notYet = nowK() < l.start;
      return `<div class="row" style="flex-direction:column;align-items:stretch;gap:6px;padding:10px 6px"><button class="rowb" data-a="loan-open" data-id="${l.id}">${l.site ? ico({ cat: 'Banque', site: l.site }, 'expenses') : `<span class="ico" style="--c:#6366F1">${svg(ic)}</span>`}<span class="rt"><span class="rn">${esc(l.name)}</span><span class="rs">${esc(kl)}${l.bank ? ' · ' + esc(l.bank) : ''} · ${String(num(l.rate)).replace('.', ',')} % · ${done ? 'remboursé ✓' : notYet ? 'commence ' + mlab(l.start).toLowerCase() : 'fin ' + mlab(c.end).toLowerCase()}</span></span>
        <span class="ra" style="text-align:right"><b class="num">${done ? '0 €' : eur0(c.left)}</b><span class="rs" style="display:block">${eur(c.total)} / mois</span></span></button>
        <div class="bar" style="margin:0 6px"><i style="width:${c.p}%;--c:${done ? 'var(--ok)' : 'var(--acc)'}"></i></div>
        <span class="note" style="font-size:12px;padding:0 6px">${Math.round(c.p)} % remboursé · échéance ${Math.min(c.paid, c.n)} / ${c.n}</span></div>`; }).join('')
      || '<p class="empty">Ajoute tes prêts (immobilier, auto, conso…) pour voir ce qu\'il reste à rembourser, les intérêts et la date de fin.</p>'}
  </section>`;
}

function loanView(id) {
  const l = loans().find(x => x.id === id); if (!l) return; const c = loanCalc(l);

  while (i < c.n) { const y = k.slice(0, 4); let cap = 0, it = 0, n = 0; while (i < c.n && k.slice(0, 4) === y) { const before = c.rem(i), after = c.rem(i + 1); cap += before - after; it += c.M - (before - after); n++; i++; k = kAdd(k, 1); } years.push([y, n, cap, it, c.rem(i)]); }
  const d = $('dlg'); d.onclick = null;
  d.innerHTML = `<div class="dw" style="max-height:86vh;overflow:auto"><div class="dh"><h2>${esc(l.name)}</h2><button class="ib sm" data-x aria-label="Fermer">${svg('x', 16, 2.4)}</button></div>

      <div class="kp" style="box-shadow:none;background:var(--soft)"><span>Dernière échéance</span><b>${mlab(c.end)}</b><small>${Math.max(0, c.n - c.paid)} mois restants</small></div>
      <div class="kp" style="box-shadow:none;background:var(--soft)"><span>Coût total du crédit</span><b class="num">${eur(c.cost)}</b><small>intérêts ${eur(c.interest)}${c.ins ? ' + assurance ' + eur(c.insTotal) : ''}</small></div>
    </div>
    <p class="note" style="font-size:13px">Emprunté : <b>${eur(c.C)}</b> à ${String(num(l.rate)).replace('.', ',')} % sur ${c.n} mois${c.n >= 12 ? ' (' + (c.n / 12).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' ans)' : ''}. Intérêts déjà payés : ${eur(c.interestPaid)}.${l.fixed ? ' Mensualité incluse dans tes charges fixes.' : ''}</p>
    <div class="tw"><table class="tpl" style="font-size:13px"><thead><tr><th>Année</th><th style="text-align:right">Capital</th><th style="text-align:right">Intérêts</th><th style="text-align:right">Reste dû</th></tr></thead><tbody>
      ${years.map(([y, n, cap, it, rest]) => `<tr${y === String(new Date().getFullYear()) ? ' style="background:var(--acc-s)"' : ''}><td>${y}${n < 12 ? ` <small style="color:var(--mute)">(${n} mois)</small>` : ''}</td><td class="num" style="text-align:right">${eur0(cap)}</td><td class="num" style="text-align:right">${eur0(it)}</td><td class="num" style="text-align:right">${eur0(rest)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="dact"><button class="btn" data-ed>Modifier</button><button class="btn p" data-x>Fermer</button></div></div>`;
  d.onclick = e => { if (e.target.closest('[data-x]')) d.close(); if (e.target.closest('[data-ed]')) { d.close(); loanDialog(id); } };
  d.showModal();
}

function newAccountDialog(kind) {

    fields: [{ id: 'name', label: 'Nom', ph: 'ex. Revolut perso' }, { id: 'bank', label: 'Banque', ph: 'ex. Revolut, Crédit Agricole, Boursorama…' },
      { id: 'site', label: 'Site web de la banque (logo, facultatif)', ph: 'rempli tout seul pour les banques connues' },
      { id: 'kind', label: 'Type', type: 'select', options: ['Courant', 'Épargne'], value: kind === 'epargne' ? 'Épargne' : 'Courant' },
      { id: 'color', label: 'Couleur', type: 'select', options: ACOL.map(c => c[0]), value: ACOL[(accIds.length) % ACOL.length][0] },
      { id: 'email', label: 'Partager avec (facultatif)', ph: 'email de l\'autre personne', hint: 'Pour un compte joint. Tu pourras aussi inviter plus tard.' }],
    ok: 'Créer',
    onSave: v => {
      if (!v.name) { toast('Donne un nom au compte'); return false; }
      createAccount({ name: v.name, bank: v.bank, site: cleanSite(v.site) || guessSite(v.bank, v.name), color: (ACOL.find(c => c[0] === v.color) || ACOL[0])[1], kind: v.kind === 'Épargne' ? 'epargne' : 'courant' }).then(id => {
        if (v.email) inviteMember(v.email, id, v.name).then(() => toast('Compte créé · invitation envoyée à ' + v.email)).catch(e => toast(e.message));
        else toast('Compte « ' + v.name + ' » créé');
        UI.view = 'accueil'; openAccount(id);
      }).catch(e => toast('Création impossible : ' + (e.code || e.message)));
    } });
}
