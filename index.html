<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F8">
<title>Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
<style>
/* ============================================================
   1. COULEURS & TAILLES (tout le thème est ici)
   ============================================================ */
:root{
  --bg:#F3F4F8; --card:#FFFFFF; --soft:#F3F4F8; --hov:#F6F7FB;
  --ink:#151A2D; --ink2:#4A5068; --mute:#6B7189; --line:#E6E8F0;
  --acc:#4338CA; --acc-d:#3730A3; --acc-s:#E7E7FB; --acc-l:#A5B4FC;
  --ok:#047857; --ok-s:#ECFDF5; --warn:#8A4B00; --warn-s:#FFF4E5; --bad:#C2341F; --bad-s:#FDECEA;
  --hero:#1E1B4B; --hero-2:#3730A3; --hero-3:#6D28D9; --hero-t:#C7C9F5; --hero-line:#3A3775;
  --sav:#0F3D3A; --sav-2:#115E59; --sav-t:#A7E3D8; --sav-acc:#5EEAD4;
  --r:20px; --shadow:0 1px 2px rgba(21,26,45,.05),0 4px 16px rgba(21,26,45,.04);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1020; --card:#171B2E; --soft:#1F2439; --hov:#1C2135;
    --ink:#E8EAF4; --ink2:#B8BDD3; --mute:#8D93AD; --line:#2A2F48;
    --acc:#6366F1; --acc-d:#A5B4FC; --acc-s:#262A55; --acc-l:#818CF8;
    --ok:#34D399; --ok-s:#0F2E26; --warn:#FBBF24; --warn-s:#33270F; --bad:#F87171; --bad-s:#3A1A1A;
    --hero:#1B1846; --hero-line:#34316E;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}

/* ============================================================
   2. BASES
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.num,input[type=number]{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
svg{flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============================================================
   3. MISE EN PAGE
   ============================================================ */
.app{display:flex;gap:24px;max-width:1320px;margin:0 auto;padding:24px;align-items:flex-start}
.side{width:220px;flex-shrink:0;position:sticky;top:24px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 14px 22px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--mute);font-weight:600;font-size:14px;border:0;background:none;min-height:44px;width:100%;text-align:left}
.nav:hover{background:var(--soft);color:var(--ink)}
.nav.on{background:var(--acc-s);color:var(--acc-d)}
.side .who{margin-top:18px;padding:12px 14px;font-size:12px;color:var(--mute);border-top:1px solid var(--line);word-break:break-all}
main{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.mnav{display:flex;align-items:center;gap:6px}
.top h1{margin:0 8px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.tools{display:flex;align-items:center;gap:10px}
.view{display:flex;flex-direction:column;gap:20px}
.grid2{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.grid2>.big{flex:2 1 420px;min-width:0}
.grid2>.small{flex:1 1 280px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}

/* ============================================================
   4. COMPOSANTS
   ============================================================ */
.card{background:var(--card);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow)}
.card h2,.h2{font-size:16px;font-weight:700;margin:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.lnk{background:none;border:0;color:var(--acc);font-weight:600;font-size:13px;padding:6px 0}
.lnk:hover{text-decoration:underline}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:var(--card);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;position:relative}
.ib:hover{background:var(--soft)}
.ib.sm{width:36px;height:36px;border-radius:10px;background:var(--soft)}
.btn{height:44px;padding:0 18px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--hov)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.danger:hover{background:var(--bad-s)}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.dot-badge{position:absolute;top:8px;right:8px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--mute)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip.cat.on{background:color-mix(in srgb,var(--c) 18%,var(--card));border-color:var(--c);color:var(--ink)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:5px 11px;white-space:nowrap;border:0;background:var(--soft);color:var(--ink2);min-height:28px}
.pill.ok{background:var(--ok-s);color:var(--ok)}
.pill.warn{background:var(--warn-s);color:var(--warn)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:none;color:var(--mute);font-weight:700;font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(21,26,45,.14)}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:0 12px;height:40px;color:var(--mute)}
.search input{border:0;background:none;outline:none;font-weight:500;width:150px;color:var(--ink)}
.in{height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-weight:600;background:var(--card);width:100%;color:var(--ink)}
.in:focus{border-color:var(--acc);outline:none}
.fl{font-size:12px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.fl small{font-weight:500}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--acc))}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:14px 10px 4px}
.lbl:first-child{padding-top:4px}
.empty{color:var(--mute);text-align:center;padding:26px 10px}
.note{font-size:13px;color:var(--mute)}
.alert{display:flex;align-items:center;gap:12px;background:var(--warn-s);color:var(--warn);border-radius:14px;padding:12px 16px;font-size:14px}
.alert.bad{background:var(--bad-s);color:var(--bad)}
.alert span{flex:1}
.alert .lnk{color:inherit;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:13px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend b{color:var(--ink)}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:3px}
.stack i{background:var(--c);min-width:3px}
.kp{background:var(--card);border-radius:18px;padding:16px 20px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.kp>span{font-size:13px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:2px}
.kp>b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kp>small{font-size:12px;color:var(--mute)}

/* Lignes de mouvement */
.row{display:flex;align-items:center;gap:8px;border-radius:12px}
.row:hover{background:var(--hov)}
.rowb{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:11px 10px;border:0;background:none;text-align:left;border-radius:12px}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs b.half{color:var(--acc);font-weight:600}
.ra{font-weight:700;font-size:14px;white-space:nowrap}
.ra.pos{color:var(--ok)}
.row .pill{margin-right:8px}
.ico{--c:#94A3B8;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden;
  background:color-mix(in srgb,var(--c) 17%,var(--card));color:color-mix(in srgb,var(--c) 72%,var(--ink))}
.ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:7px;background:#fff}
.ico.sm{width:32px;height:32px;border-radius:10px}
.ico.sm svg{width:17px;height:17px}

/* Infobulles */
.tip{position:relative;display:inline-flex;vertical-align:middle}
.tip>button{width:28px;height:28px;margin:-6px 0;border:0;border-radius:50%;background:none;color:inherit;opacity:.65;cursor:help;display:inline-flex;align-items:center;justify-content:center}
.tip>button:hover,.tip>button:focus-visible{opacity:1;background:color-mix(in srgb,currentColor 14%,transparent)}
.bub{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:300px;max-width:80vw;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.5;font-weight:500;text-align:left;letter-spacing:0;text-transform:none;box-shadow:0 12px 32px rgba(21,26,45,.2);opacity:0;visibility:hidden;transition:opacity .15s;z-index:40;pointer-events:none;white-space:normal}
.tip.dn .bub{bottom:auto;top:calc(100% + 8px)}
.tip.lf .bub{left:auto;right:-8px;transform:none}
.tip.rt .bub{left:-8px;transform:none}
.tip:hover .bub,.tip:focus-within .bub{opacity:1;visibility:visible}
.bub b.bt{display:block;font-weight:700;margin-bottom:4px;font-size:13px}
.eq{display:grid;grid-template-columns:1fr auto;gap:3px 14px;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.eq .tot{border-top:1px solid var(--line);padding-top:5px;font-weight:800}
.bub small{display:block;color:var(--mute);font-size:12px;margin-top:6px}

/* Carte principale (accueil) */
.hero{flex:2 1 420px;background:var(--hero);color:#fff;border-radius:24px;padding:28px 30px;display:flex;flex-direction:column;gap:22px;position:relative}
.hero .deco{position:absolute;inset:0;border-radius:24px;overflow:hidden;pointer-events:none}
.hero .deco i{position:absolute;border-radius:50%}
.hero>*:not(.deco){position:relative}
.hero .t{font-size:14px;font-weight:600;color:var(--hero-t);display:flex;align-items:center;gap:4px}
.hero .v{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.hero .v.neg{color:#FCA5A5}
.hero .s{font-size:14px;color:var(--hero-t)}
.hero .s b{color:#fff}
.hero .hb{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.hero .hb i{display:block;height:100%;border-radius:99px;background:var(--acc-l)}
.hero .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-top:1px solid var(--hero-line);padding-top:18px}
.hero .stats>div>span{font-size:12px;color:#B4B6EA;display:flex;align-items:center;gap:2px}
.hero .stats>div>b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.hero .bk{background:none;border:0;color:var(--hero-t);font-size:12px;font-weight:600;text-align:left;padding:2px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.3)}
.hero.sav{background:var(--sav)}
.hero.sav .t,.hero.sav .s{color:var(--sav-t)}
.hero.sav .hb i{background:var(--sav-acc)}

/* Calendrier échéancier */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wk{font-size:11px;font-weight:700;color:var(--mute);text-align:center;letter-spacing:.04em;padding-bottom:4px}
.cal .d{height:46px;border-radius:10px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600;color:var(--ink2)}
.cal .d.has{background:var(--soft)}
.cal .d.late{background:var(--warn-s);color:var(--warn)}
.cal .d.today{background:var(--acc);color:#fff}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--acc)}
.cal .d i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini>div{border-radius:12px;padding:10px 14px}
.mini span{display:flex;align-items:center;gap:2px;font-size:12px;font-weight:600}
.mini b{font-size:18px;font-variant-numeric:tabular-nums}

/* Tableaux */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:700;color:var(--mute);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{font-size:14px;text-align:right;padding:11px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.go{cursor:pointer}
tr.go:hover td{background:var(--hov)}
.tpl td{padding:5px 6px}
.tpl input,.tpl select{height:38px;border:1px solid transparent;border-radius:10px;background:var(--soft);padding:0 10px;font-weight:600;width:100%;color:var(--ink)}
.tpl input:focus,.tpl select:focus{border-color:var(--acc);outline:none;background:var(--card)}
.tpl input.d{width:56px;text-align:center}
.tpl input[type=number]{text-align:right;min-width:90px}
.tpl .half{height:38px;min-width:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:800;color:var(--mute)}
.tpl .half.on{background:var(--acc-s);border-color:var(--acc-l);color:var(--acc-d)}
.x{width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--mute);display:inline-flex;align-items:center;justify-content:center}
.x:hover{background:var(--bad-s);color:var(--bad)}
.cvh{position:relative;height:280px}

/* Fiche latérale d'édition */
.scrim{position:fixed;inset:0;background:rgba(13,16,32,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);z-index:61;box-shadow:-12px 0 40px rgba(13,16,32,.2);transform:translateX(105%);transition:transform .22s ease,visibility .22s;display:flex;flex-direction:column;visibility:hidden}
.panel.on{transform:none;visibility:visible}
.pbody{flex:1;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:18px}
.pfoot{padding:16px 24px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px}
.amt{display:flex;align-items:baseline;justify-content:center;gap:6px;border-bottom:2px solid var(--acc-l);padding:6px 0 10px}
.amt input{border:0;outline:none;background:none;font-weight:800;font-size:44px;width:200px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.amt span{font-size:28px;font-weight:700;color:var(--mute)}
.tog{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:700;font-size:14px;width:100%}
.tog.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-s);color:var(--ok)}
.tog.half{height:36px;width:auto;padding:0 14px;border-radius:999px;font-size:13px}
.tog.half.on{border-color:var(--acc-l);background:var(--acc-s);color:var(--acc-d)}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--ink2);min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.fixinfo{background:var(--acc-s);color:var(--acc-d);border-radius:12px;padding:12px 14px;font-size:13px;display:flex;flex-direction:column;gap:8px}

/* Dialogues */
dialog{border:0;border-radius:20px;padding:0;width:min(440px,calc(100% - 24px));background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35);margin:auto}
dialog::backdrop{background:rgba(13,16,32,.5);backdrop-filter:blur(2px)}
.dw{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dh h2{font-size:17px;font-weight:800}
.dact{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.dact .btn.p{flex:1}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:12px;font-weight:600;display:flex;gap:16px;align-items:center;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast.act{pointer-events:auto}
#toast button{background:none;border:0;color:var(--acc-l);font-weight:800}

/* Connexion */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth .card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;padding:32px}
.auth .brand{padding:0 0 10px}
.auth h1{font-size:22px;font-weight:800}
.auth .err{font-size:13px;min-height:18px}
.loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--mute);text-align:center;padding:20px}

/* ============================================================
   5. TÉLÉPHONE / PETITS ÉCRANS
   ============================================================ */
@media (max-width:900px){
  .app{padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px));gap:0}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;z-index:50;flex-direction:row;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px}
  .side .brand,.side .who{display:none}
  .nav{flex:1;flex-direction:column;gap:3px;font-size:10.5px;padding:7px 2px;justify-content:center;text-align:center;min-height:52px}
  .top h1{font-size:21px}
  .hero{padding:22px}
  .hero .v{font-size:40px}
  .hero .stats>div>b{font-size:15px}
  .card{padding:18px}
  #toast{bottom:96px}
  .panel{top:auto;height:92vh;width:100%;border-radius:20px 20px 0 0;transform:translateY(105%)}
  .panel.on{transform:none}
  .bub{position:fixed;left:16px!important;right:16px!important;top:auto!important;bottom:110px!important;transform:none!important;width:auto;max-width:none}
}
@media (max-width:520px){
  .hero .stats{grid-template-columns:1fr 1fr}
  .tools .btn span{display:none}
  .tools .btn{padding:0 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff}

<script>
'use strict';
/* =====================================================================
   BUDGET — application de suivi des dépenses
   Organisation du code :
     1. Firebase            5. Synchro & sauvegardes
     2. Outils              6. Connexion & compte
     3. Données             7. Interface : briques communes
     4. Calculs             8. Écrans · 9. Fiche d'édition · 10. Événements
   ===================================================================== */

/* ============================== 1. FIREBASE ============================== */
const firebaseConfig = {
  apiKey: "AIzaSyAVfKgI_h4TpjmrSFIsbRRrTulOy672ywI",
  authDomain: "finance-budget-2026.firebaseapp.com",
  projectId: "finance-budget-2026",
  storageBucket: "finance-budget-2026.firebasestorage.app",
  messagingSenderId: "731092994652",
  appId: "1:731092994652:web:39de5d2fe7d8593abdb499"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
auth.languageCode = 'fr';
const db = firebase.firestore();
// Cache hors-ligne : l'app marche sans réseau et renvoie les modifications au retour de la connexion
db.enablePersistence({ synchronizeTabs: true }).catch(e => console.warn('Persistance hors-ligne indisponible :', e.code));
let currentUser = null;

/* ============================== 2. OUTILS ============================== */
const $ = id => document.getElementById(id);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => Number(v) || 0;
const eur = v => num(v).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
const eur0 = v => num(v).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '') + eur(Math.abs(v));
const minus = v => '−' + eur(Math.abs(v));
const eff = e => e.isDivided ? num(e.amount) / 2 : num(e.amount);       // part personnelle (½)
const sum = (a, f = x => num(x.amount)) => a.reduce((s, x) => s + f(x), 0);
const day = v => { const n = parseInt(v); return n >= 1 && n <= 31 ? String(n) : ''; };
const parseAmt = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmtIn = v => (v === '' || v == null) ? '' : String(Math.round(num(v) * 100) / 100).replace('.', ',');
const pct = (a, b) => b > 0 ? a / b * 100 : 0;
const MN = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const mkey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const nowK = () => mkey(new Date());
const keyDate = k => { const [y, m] = k.split('-'); return new Date(+y, +m - 1, 1); };
const shiftK = (k, n) => { const d = keyDate(k); d.setMonth(d.getMonth() + n); return mkey(d); };
const mlab = k => { const d = keyDate(k); return MN[d.getMonth()] + ' ' + d.getFullYear(); };
const mshort = k => { const d = keyDate(k); return MS[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2); };
const dim = k => { const d = keyDate(k); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };
const today = () => new Date().getDate();
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function daysLeft(k) { const n = nowK(); return k === n ? dim(k) - today() + 1 : k > n ? dim(k) : 0; }
function dayDate(k, d) { const x = keyDate(k); x.setDate(Math.min(d, dim(k))); return x; }
function shortDay(k, d) { return dayDate(k, d).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }); }
function dayLabel(k, d) {
  if (k === nowK()) { if (d === today()) return "Aujourd'hui"; if (d === today() - 1) return 'Hier'; }
  return cap(dayDate(k, d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }));
}
const cleanSite = s => String(s || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/[/?#].*$/, '');

/* ============================== 3. DONNÉES ==============================
   S = { categories, templates:{expenses,incomes,budgets}, months:{'AAAA-MM':{bankBalance,savingGoal,expenses,incomes,budgets}},
         savings (simulateur), savAcc (comptes d'épargne), alerts (seuils) }
   Un « modèle » (template) est une charge/recette/budget récurrent, recopié dans chaque nouveau mois.      */
const LS = 'budget_app_state';
const DC = ['Logement','Énergie','Assurance','Abonnement','Banque','Alimentation','Transport','Santé','Loisirs','Autre'];
const fresh = () => ({ categories: [...DC], templates: { expenses: [], incomes: [], budgets: [] }, months: {} });

function normalize(s) {
  s.categories = s.categories?.length ? s.categories : [...DC];
  s.templates = s.templates || {};
  ['expenses','incomes','budgets'].forEach(k => s.templates[k] = s.templates[k] || []);
  const fix = e => {
    const had = / \(Divisé par 2\)/.test(e.name || '');                  // ancien format
    if (e.isDivided && had) e.amount = e.originalAmount != null ? num(e.originalAmount) : num(e.amount) * 2;
    if (e.name !== undefined || e.cat === undefined) e.name = (e.name || '').replace(' (Divisé par 2)', '');
    e.isDivided = !!e.isDivided; e.date = day(e.date); e.amount = num(e.amount);
    if (!e.site) delete e.site; if (!e.img) delete e.img;
    delete e.originalAmount; delete e.hasReceipt;
  };
  Object.values(s.templates).forEach(a => a.forEach(t => { t.tmplId = t.tmplId || uid(); fix(t); }));
  s.months = s.months || {};
  Object.values(s.months).forEach(m => {
    const nz = v => (v === '' || v == null) ? null : num(v);
    m.bankBalance = nz(m.bankBalance); m.savingGoal = nz(m.savingGoal);
    m.expenses = m.expenses || []; m.incomes = m.incomes || [];
    m.budgets = m.budgets || JSON.parse(JSON.stringify(s.templates.budgets));
    [...m.expenses, ...m.incomes, ...m.budgets].forEach(x => { x.id = x.id || uid(); fix(x); });
    m.budgets.forEach(b => { delete b.name; delete b.date; delete b.isDivided; });
    [...m.expenses, ...m.incomes].forEach(x => {
      x.isFixed = !!x.isFixed;
      if (x.isFixed && !x.tmplId) { const t = s.templates[m.expenses.includes(x) ? 'expenses' : 'incomes'].find(t => t.name === x.name); x.tmplId = t ? t.tmplId : uid(); }
    });
  });
  s.templates.budgets.forEach(b => { delete b.name; delete b.date; delete b.isDivided; });
  return s;
}

let S = normalize(fresh());
let cur = new Date(); cur.setDate(1); cur.setHours(0, 0, 0, 0);
const ck = () => mkey(cur);

// Copie d'un modèle dans un mois
const instance = (type, t) => ({ ...JSON.parse(JSON.stringify(t)), id: uid(),
  ...(type === 'expenses' ? { status: 'Prévu', isFixed: true } : type === 'incomes' ? { status: 'En attente', isFixed: true } : {}) });

// Mois affiché. Créé à la volée à partir des modèles ; tant qu'il n'est pas modifié, c'est un « brouillon » non sauvegardé.
function month(k = ck()) {
  if (!S.months[k]) {
    const m = { bankBalance: null, savingGoal: null,
      expenses: S.templates.expenses.map(t => instance('expenses', t)),
      incomes: S.templates.incomes.map(t => instance('incomes', t)),
      budgets: S.templates.budgets.map(t => instance('budgets', t)) };
    Object.defineProperty(m, '_snap', { value: JSON.stringify(m), writable: true, configurable: true, enumerable: false });
    S.months[k] = m;
  }
  return S.months[k];
}
const isDraft = m => !!m && m._snap !== undefined && JSON.stringify(m) === m._snap;
const monthsFrom = k => Object.keys(S.months).filter(x => x >= k);

// Recopie des champs d'un modèle vers les mois ≥ fromKey (sauf éléments déjà payés / reçus)
function syncTpl(type, t, fields, fromKey = ck()) {
  monthsFrom(fromKey).forEach(k => {
    const l = S.months[k][type].find(x => x.tmplId === t.tmplId); if (!l) return;
    if (type !== 'budgets' && (l.status === 'Payé' || l.status === 'Reçu')) return;
    fields.forEach(f => { if (t[f] === undefined || t[f] === '') delete l[f]; else l[f] = t[f]; });
  });
}
function tplAdd(type, t, fromKey = ck()) {
  S.templates[type].push(t);
  monthsFrom(fromKey).forEach(k => S.months[k][type].push(instance(type, t)));
}
function tplDel(type, tmplId, fromKey = ck()) {
  S.templates[type] = S.templates[type].filter(t => t.tmplId !== tmplId);
  monthsFrom(fromKey).forEach(k => {
    const mm = S.months[k];
    mm[type] = mm[type].filter(y => {
      if (y.tmplId !== tmplId) return true;
      if (type !== 'budgets' && (y.status === 'Payé' || y.status === 'Reçu')) { y.isFixed = false; delete y.tmplId; return true; }
      return false;
    });
  });
}
const tplFields = type => type === 'expenses' ? ['name','amount','date','cat','isDivided','site','img'] : type === 'incomes' ? ['name','amount','date','site','img'] : ['cat','amount'];
function tplFrom(type, x) {
  const t = { tmplId: uid() };
  tplFields(type).forEach(f => { if (x[f] !== undefined && x[f] !== '') t[f] = x[f]; });
  return t;
}

// Catégorie déduite d'un libellé déjà utilisé
function autoCat(name) {
  const q = String(name || '').trim().toLowerCase(); if (q.length < 2) return null;
  for (const k of Object.keys(S.months).sort().reverse()) {
    const ex = S.months[k].expenses;
    for (let i = ex.length - 1; i >= 0; i--) if ((ex[i].name || '').trim().toLowerCase() === q && ex[i].cat) return ex[i].cat;
  }
  const t = S.templates.expenses.find(t => (t.name || '').trim().toLowerCase() === q);
  return t ? t.cat : null;
}
const isPaid = (x, type) => type === 'incomes' ? x.status === 'Reçu' : x.status === 'Payé';

/* ============================== 4. CALCULS ============================== */
const vspent = (m, c) => sum(m.expenses.filter(e => !e.isFixed && e.cat === c), eff);

// Variation du compte sur un mois : réelle pour les mois passés, projetée pour le mois en cours et les suivants
function monthFlow(m, key) {
  if (key < nowK())
    return sum(m.incomes.filter(i => i.status === 'Reçu')) - sum(m.expenses.filter(e => e.status === 'Payé'), eff) - num(m.savingGoal);
  const bL = sum(m.budgets, b => Math.max(0, num(b.amount) - vspent(m, b.cat)));
  return sum(m.incomes) - sum(m.expenses, eff) - bL - num(m.savingGoal);
}
// Solde au 1er du mois : dernier solde réel saisi (ce mois-ci ou avant) + variations des mois intermédiaires
function chainBalance(targetKey) {
  let bal = 0;
  for (const key of Object.keys(S.months).sort()) {
    if (key > targetKey) break;
    const m = S.months[key];
    if (m.bankBalance != null) bal = num(m.bankBalance);
    if (key === targetKey) return bal;
    bal += monthFlow(m, key);
  }
  return bal;
}
function calc(m, key) {
  const ex = m.expenses, inc = m.incomes, fx = ex.filter(e => e.isFixed), vr = ex.filter(e => !e.isFixed);
  const bcats = new Set(m.budgets.map(b => b.cat));
  const r = {
    incAll: sum(inc), incIn: sum(inc.filter(i => i.status === 'Reçu')),
    outAll: sum(ex, eff), outPaid: sum(ex.filter(e => e.status === 'Payé'), eff), outPlan: sum(ex.filter(e => e.status !== 'Payé'), eff),
    fixAll: sum(fx, eff), fixPaid: sum(fx.filter(e => e.status === 'Payé'), eff),
    varAll: sum(vr, eff),
    budAll: sum(m.budgets),
    budLeft: sum(m.budgets, b => Math.max(0, num(b.amount) - vspent(m, b.cat))),
    budEff: sum(m.budgets, b => Math.max(num(b.amount), vspent(m, b.cat))),   // budget, ou dépensé s'il est dépassé
    varOut: sum(vr.filter(e => !bcats.has(e.cat)), eff),                        // dépenses variables hors budget
    saving: num(m.savingGoal)
  };
  r.fixLeft = r.fixAll - r.fixPaid;
  r.spent = r.fixPaid + r.varAll;
  r.planned = r.fixAll + r.budAll + r.varOut;
  r.free = r.incAll - r.fixAll - r.budEff - r.varOut - r.saving;              // part des recettes non affectée (écran Budgets)
  r.init = chainBalance(key);
  r.bankSet = m.bankBalance != null;
  r.current = r.init + r.incIn - r.outPaid;
  r.flow = monthFlow(m, key);
  r.est = r.init + r.flow;
  r.past = key < nowK();
  r.incWait = r.incAll - r.incIn;
  // Reste à vivre = solde actuel + recettes à venir − dépenses à payer − épargne prévue
  // (= ce qu'il restera fin de mois si tu ne dépenses plus rien ; les budgets se dépensent dedans)
  r.rav = r.past ? r.est : r.current + r.incWait - r.outPlan - r.saving;
  r.left = daysLeft(key);
  r.perDay = r.left > 0 ? Math.max(0, r.rav) / r.left : null;
  return r;
}
// Dépenses réellement engagées par catégorie (charges fixes payées + variables)
function catTotals(m) {
  const o = {};
  m.expenses.forEach(e => { const v = eff(e); if (v <= 0 || (e.isFixed && e.status !== 'Payé')) return; o[e.cat] = (o[e.cat] || 0) + v; });
  return o;
}
// État d'une échéance : ok (réglée) / late (date passée) / plan (à venir)
function dueState(x, type, k) {
  if (isPaid(x, type)) return 'ok';
  const d = parseInt(x.date), n = nowK();
  if (k < n) return 'late';
  if (k === n && d && d < today()) return 'late';
  if (k === n && d && d === today()) return 'due';
  return 'plan';
}

/* ---------- Alertes ---------- */
const AL = () => S.alerts = Object.assign({ thr: 0, pct: 20 }, S.alerts || {});
function alerts(k = ck()) {
  const m = S.months[k], o = []; if (!m) return o;
  const c = calc(m, k), A = AL();
  if (k === nowK()) {
    const late = m.expenses.filter(e => e.isFixed && dueState(e, 'expenses', k) === 'late');
    if (late.length) o.push({ lvl: 'bad', text: `${late.length} charge${late.length > 1 ? 's' : ''} fixe${late.length > 1 ? 's' : ''} en retard · ${eur(sum(late, eff))}`, go: 'mouvements', flt: 'todo' });
  }
  if (!c.past && c.est < num(A.thr)) o.push({ lvl: 'bad', text: `Fin de mois estimée : ${eur(c.est)} (seuil ${eur(A.thr)})`, go: 'accueil' });
  if (!c.past && c.rav < 0) o.push({ lvl: 'bad', text: `Reste à vivre négatif : ${eur(c.rav)}`, go: 'accueil' });
  m.budgets.forEach(b => {
    const s = vspent(m, b.cat), q = num(b.amount);
    if (q > 0 && s > q) o.push({ lvl: 'bad', text: `Budget ${b.cat} dépassé de ${eur(s - q)}`, go: 'budgets' });
    else if (q > 0 && s > q * .85) o.push({ lvl: 'warn', text: `Budget ${b.cat} presque atteint : ${eur(s)} sur ${eur(q)}`, go: 'budgets' });
  });
  const pv = Object.keys(S.months).sort().filter(x => x < k && !isDraft(S.months[x])).slice(-3);
  if (pv.length) {
    const n = catTotals(m), ps = pv.map(x => catTotals(S.months[x]));
    Object.entries(n).forEach(([cat, v]) => {
      const av = ps.reduce((s, q) => s + (q[cat] || 0), 0) / pv.length;
      if (av > 20 && v > av * (1 + num(A.pct) / 100))
        o.push({ lvl: 'warn', text: `${cat} : ${eur(v)}, soit +${Math.round((v / av - 1) * 100)} % par rapport à la moyenne`, go: 'mouvements', q: cat });
    });
  }
  return o.sort((a, b) => (a.lvl === 'bad' ? 0 : 1) - (b.lvl === 'bad' ? 0 : 1));
}

/* ============================== 5. SYNCHRO & SAUVEGARDES ============================== */
const cacheKey = u => LS + '_' + u;
const docRef = (u = currentUser.uid) => db.collection('users').doc(u).collection('data').doc('budget');
let loaded = false, unsub = null, saveTimer = null, waitTimer = null, lastSent = null;

// État à sauvegarder (sans les mois seulement consultés)
function snapshot() {
  const months = {};
  for (const [k, m] of Object.entries(S.months)) {
    if (m._snap !== undefined) { if (JSON.stringify(m) === m._snap) continue; delete m._snap; }
    months[k] = m;
  }
  return JSON.stringify({ ...S, months });
}
function save() {
  if (!currentUser || !loaded) return;                    // jamais avant le chargement des vraies données
  const data = snapshot();
  try { localStorage.setItem(cacheKey(currentUser.uid), data); } catch (e) { toast('⚠ Sauvegarde locale impossible'); }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushCloud, 800);                 // regroupe les modifications rapprochées
}
function pushCloud() {
  saveTimer = null;
  if (!currentUser || !loaded) return Promise.resolve();
  const data = snapshot(); lastSent = data;
  return docRef().set({ budgetData: data, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
    .catch(e => { console.error(e); toast('⚠ Synchro cloud refusée — données gardées sur cet appareil'); });
}
function flush() { if (!saveTimer) return Promise.resolve(); clearTimeout(saveTimer); return pushCloud(); }
addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
addEventListener('pagehide', () => flush());
function stopSync() {
  if (unsub) { unsub(); unsub = null; }
  clearTimeout(saveTimer); saveTimer = null; clearTimeout(waitTimer); waitTimer = null;
  loaded = false; lastSent = null;
}
const readCache = u => { try { return localStorage.getItem(cacheKey(u)); } catch (e) { return null; } };
function showScreen(w) {
  $('auth-screen').hidden = w !== 'auth';
  $('loading').hidden = w !== 'loading';
  $('app').hidden = w !== 'app';
}

/* ---------- Sauvegardes automatiques (users/{uid}/backups) ---------- */
const BK_MAX = 40;
let bkCache = {};
const bkCol = (u = currentUser.uid) => db.collection('users').doc(u).collection('backups');
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const hasContent = str => { try { const d = JSON.parse(str); return Object.keys(d.months || {}).length > 0 || ['expenses','incomes','budgets'].some(k => (d.templates?.[k] || []).length); } catch (e) { return false; } };
function backupNow(kind, data = snapshot()) {           // la donnée est figée au moment de l'appel
  if (!currentUser || !loaded || !hasContent(data)) return Promise.resolve(false);
  const id = kind === 'quotidienne' ? dayKey() : dayKey() + '_' + Date.now();
  return bkCol().doc(id).set({ budgetData: data, kind, createdAt: Date.now() })
    .then(() => { pruneBackups(); return true; })
    .catch(e => { console.error('Sauvegarde', e); return false; });
}
function dailyBackup(data) {
  bkCol().doc(dayKey()).get({ source: 'server' })
    .then(d => { if (!d.exists) return backupNow('quotidienne', data); }).catch(() => {});
}
function pruneBackups() {
  bkCol().orderBy('createdAt', 'desc').get({ source: 'server' })
    .then(q => q.docs.slice(BK_MAX).forEach(d => d.ref.delete())).catch(() => {});
}

function startWith(str, msg, push) {
  clearTimeout(waitTimer);
  try { S = normalize(str ? JSON.parse(str) : fresh()); }
  catch (e) { console.error(e); S = normalize(fresh()); push = false; msg = "⚠ Données illisibles : rien n'a été écrasé"; }
  lastSent = str; loaded = true; undoSnap = null;
  if (str && !push) dailyBackup(str);
  showScreen('app'); render();
  if (push) save();
  if (msg) toast(msg);
}

auth.onAuthStateChanged(user => {
  stopSync(); closePanel(true);
  if (!user) { currentUser = null; S = normalize(fresh()); showScreen('auth'); return; }
  currentUser = user;
  const u = user.uid;
  $('who').textContent = user.email;
  showScreen('loading');
  waitTimer = setTimeout(() => { if (!loaded) { const c = readCache(u); if (c) startWith(c, '📴 Hors-ligne : données de cet appareil'); } }, 6000);
  unsub = docRef(u).onSnapshot({ includeMetadataChanges: true }, doc => {
    if (doc.metadata.hasPendingWrites) return;                    // écho de nos propres écritures
    const remote = doc.exists ? doc.data().budgetData : null;
    if (!loaded) {
      if (remote) return startWith(remote);
      if (doc.metadata.fromCache) return;                         // on attend la réponse du serveur
      const c = readCache(u);
      return startWith(c, c ? null : 'Bienvenue ! Commence par ajouter ton salaire et tes charges fixes.', true);
    }
    if (!remote || remote === lastSent || saveTimer) return;      // modification venue d'un autre appareil
    if (remote === snapshot()) { lastSent = remote; return; }
    try { S = normalize(JSON.parse(remote)); } catch (e) { return; }
    lastSent = remote; undoSnap = null;
    try { localStorage.setItem(cacheKey(u), remote); } catch (e) {}
    render(); toast('🔄 Mis à jour depuis un autre appareil');
  }, err => {
    console.error(err);
    if (loaded) return toast('⚠ Synchro interrompue : ' + err.code);
    const c = readCache(u);
    if (c) return startWith(c, '⚠ Cloud inaccessible : données de cet appareil');
    $('loading').innerHTML = '⚠ Impossible de charger vos données (' + esc(err.code) + ').<br><button class="btn p" onclick="location.reload()">Réessayer</button>';
  });
});

function pwdDialog({ title, msg, needNew, okLabel, danger, action }) {

  $('pwd-cur').value = ''; $('pwd-new').value = ''; $('pwd-err').textContent = '';

  const ravTip = tip('reste à vivre', 'Reste à vivre', c.past ? 'Mois terminé : ce qui restait sur le compte en fin de mois.' + eq([['Fin de mois', eur(c.est)]], ['= Reste à vivre', eur(c.rav)]) : "Ce qu'il te restera en fin de mois si tu ne dépenses plus rien. Tes budgets (courses, loisirs…) se dépensent là-dedans." + eq([
      ['Solde actuel', eur(c.current)], c.incWait > 0 && ['+ Recettes à venir', eur(c.incWait)], ['− Dépenses à payer', eur(c.outPlan)], ['− Épargne prévue', eur(c.saving)]],
      ['= Reste à vivre', eur(c.rav)], c.perDay != null ? `Par jour : ${eur(Math.max(0, c.rav))} ÷ ${c.left} jour${c.left > 1 ? 's' : ''} restant${c.left > 1 ? 's' : ''} = ${eur(c.perDay)}.` : ''), 'dn rt');
  const depTip = tip('dépensé', 'Dépensé ce mois', eq([['Charges fixes payées', eur(c.fixPaid)], ['+ Dépenses variables', eur(c.varAll)]], ['= Dépensé', eur(c.spent)],
      `Prévu = charges fixes (${eur(c.fixAll)}) + budgets (${eur(c.budAll)})${c.varOut > 0 ? ` + hors budget (${eur(c.varOut)})` : ''} = ${eur(c.planned)}.`), 'lf');
  const solTip = tip('solde actuel', 'Solde actuel', eq([[`Solde au 1er ${MN[cur.getMonth()].toLowerCase()}`, eur(c.init)], ['+ Recettes reçues', eur(c.incIn)], ['− Dépenses payées', eur(c.outPaid)]],

  const unpaid = m.expenses.filter(e => e.status !== 'Payé');
  const rapTip = tip('reste à payer', 'Reste à payer', 'Tout ce qui est encore « À payer » ou « Prévu » ce mois-ci.' + eq(
      unpaid.slice(0, 6).map(e => [esc(e.name || e.cat) + (e.date ? ` (${e.date})` : ''), eur(eff(e))]).concat(unpaid.length > 6 ? [[`+ ${unpaid.length - 6} autres`, eur(sum(unpaid.slice(6), eff))]] : []),
      ['= Reste à payer', eur(c.outPlan)]));
  const finTip = tip('fin de mois estimée', 'Fin de mois estimée', c.past
      ? 'Ce mois est terminé : calcul sur ce qui a réellement été reçu et payé.' + eq([['Solde au 1er', eur(c.init)], ['+ Recettes reçues', eur(c.incIn)], ['− Dépenses payées', eur(c.outPaid)], ['− Épargne', eur(c.saving)]], ['= Fin de mois', eur(c.est)])
      : `Ce qu'il devrait rester sur ton compte le ${dim(k)} ${MN[cur.getMonth()].toLowerCase()} si tu dépenses tes budgets jusqu'au bout.` + eq([['Reste à vivre', eur(c.rav)], ['− Reste des budgets', eur(c.budLeft)]], ['= Fin de mois', eur(c.est)],
        c.budLeft > 0 ? 'Estimation prudente : si tu dépenses moins que tes budgets, tu finiras plus haut (au mieux ' + eur(c.rav) + ').' : ''), 'lf');

  // Prochains prélèvements
  const isCur = k === nowK();
  const fixedUnpaid = m.expenses.filter(e => e.isFixed && e.status !== 'Payé').sort((a, b) => (parseInt(a.date) || 99) - (parseInt(b.date) || 99));
  const next = (isCur ? fixedUnpaid.filter(e => !parseInt(e.date) || parseInt(e.date) >= today()) : fixedUnpaid).slice(0, 4);
  const nextHTML = next.map(e => {
    const d = parseInt(e.date);
    const when = d ? shortDay(k, d) + (isCur ? (d === today() ? " · aujourd'hui" : ` · dans ${d - today()} j`) : '') : 'sans date';

  // Derniers mouvements
  const recent = []; groups(m, k, 'all', '').filter(g => g.key !== 'next').forEach(g => g.items.forEach(it => recent.push([g, it])));
  let lastG = null;
  const recentHTML = recent.slice(0, 6).map(([g, [x, t]]) => { const h = g !== lastG ? `<div class="lbl">${g.label}</div>` : ''; lastG = g; return h + rowHTML(x, t, k, { pill: false }); }).join('')
    || '<p class="empty">Aucun mouvement ce mois-ci.</p>';

  // Budgets (3 premiers)
  const budHTML = m.budgets.slice(0, 4).map(b => {
    const s = vspent(m, b.cat), a = num(b.amount), p = pct(s, a), ci = catInfo(b.cat), col = p > 100 ? 'var(--bad)' : p > 85 ? '#F97316' : ci.col;
    return `<div style="display:flex;flex-direction:column;gap:7px"><div style="display:flex;justify-content:space-between;font-size:14px"><b style="font-weight:600">${esc(b.cat)}</b><span class="num" style="color:var(--ink2)"><b style="color:var(--ink)">${eur(s)}</b> / ${eur0(a)}</span></div>
      <div class="bar"><i style="width:${Math.min(100, p)}%;--c:${col}"></i></div>
      <span style="font-size:12px;${p > 85 ? 'color:var(--warn);font-weight:600' : 'color:var(--mute)'}">${a - s >= 0 ? 'Reste ' + eur(a - s) : 'Dépassé de ' + eur(s - a)}${p > 85 && p <= 100 ? ' · ' + Math.round(p) + ' %' : ''}</span></div>`;
  }).join('') || '<p class="empty">Aucun budget. Crée une enveloppe (courses, loisirs…) dans Budgets.</p>';

  // Répartition
  const ct = Object.entries(catTotals(m)).sort((a, b) => b[1] - a[1]), tot = ct.reduce((s, x) => s + x[1], 0);
  const top = ct.slice(0, 6), rest = ct.slice(6).reduce((s, x) => s + x[1], 0);
  const parts = top.map(([n, v]) => [n, v, catInfo(n).col]).concat(rest > 0 ? [['Autres', rest, '#94A3B8']] : []);
  const repHTML = tot > 0 ? `<div class="stack">${parts.map(([, v, col]) => `<i style="flex:${v};--c:${col}"></i>`).join('')}</div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;font-size:13px">${parts.map(([n, v, col]) => `<span style="display:flex;align-items:center;gap:8px"><i style="width:10px;height:10px;border-radius:3px;background:${col}"></i>${esc(n)} <b class="num" style="margin-left:auto">${Math.round(v / tot * 100)} %</b></span>`).join('')}</div>`
    : '<p class="empty">Rien de dépensé pour l\'instant.</p>';

  const al = alerts(k);
  const alertHTML = al.length ? `<div class="alert ${al[0].lvl === 'bad' ? 'bad' : ''}" role="status">${svg('warn')}<span>${esc(al[0].text)}${al.length > 1 ? ` <small>(+${al.length - 1} autre${al.length > 2 ? 's' : ''})</small>` : ''}</span><button class="lnk" data-a="${al.length > 1 ? 'alerts' : 'alertgo'}">Voir</button></div>` : '';

  const onboard = empty ? `<section class="card" style="display:flex;flex-direction:column;gap:14px">
      <h2>Bienvenue ! On démarre en 3 étapes</h2>
      <div class="chips"><button class="btn" data-a="ob-inc">1. Ajouter mon salaire</button><button class="btn" data-a="ob-fix">2. Ajouter une charge fixe</button><button class="btn" data-a="bank">3. Saisir mon solde bancaire</button></div>
      <p class="note">Salaire et charges fixes sont recopiés automatiquement chaque mois. Tu pourras tout modifier ensuite.</p></section>` : '';

  V.innerHTML = `${onboard}
  <div class="grid2">
    <section class="hero" aria-label="Reste à vivre">
      <div class="deco"><i style="right:-60px;top:-80px;width:260px;height:260px;background:var(--hero-2);opacity:.55"></i><i style="right:70px;top:90px;width:120px;height:120px;background:var(--hero-3);opacity:.35"></i></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <span class="t">Reste à vivre ${c.past ? 'en ' + MN[cur.getMonth()].toLowerCase() : `jusqu'au ${dim(k)} ${MN[cur.getMonth()].toLowerCase()}`} ${ravTip}</span>
        <span class="v num${c.rav < 0 ? ' neg' : ''}">${eur(c.rav)}</span>
        <span class="s">${c.perDay != null ? `soit <b class="num">${eur(c.perDay)} / jour</b> pendant ${c.left} jour${c.left > 1 ? 's' : ''}` : c.past ? 'Mois terminé' : ''}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--hero-t)"><span style="display:flex;align-items:center;gap:4px">Dépensé ce mois ${depTip}</span><span class="num"><b style="color:#fff">${eur(c.spent)}</b> sur ${eur(c.planned)} prévus</span></div>
        <div class="hb"><i style="width:${Math.min(100, pct(c.spent, c.planned))}%"></i></div>

/* ---------- MOUVEMENTS ---------- */
// Regroupe les mouvements par jour (« À venir » en tête pour le mois en cours)
function groups(m, k, flt, q) {
  const isCur = k === nowK(), td = today();
  let items = [...m.expenses.map(x => [x, 'expenses']), ...m.incomes.map(x => [x, 'incomes'])];
  items = items.filter(([x, t]) => {
    if (flt === 'todo' && !(t === 'expenses' && x.status !== 'Payé')) return false;
    if (flt === 'fixed' && !x.isFixed) return false;
    if (flt === 'var' && (x.isFixed || t !== 'expenses')) return false;
    if (flt === 'inc' && t !== 'incomes') return false;
    if (q && !((x.name || '') + ' ' + (x.cat || '')).toLowerCase().includes(q)) return false;
    return true;
  });
  const G = new Map(), add = (key, label, ord, it) => { if (!G.has(key)) G.set(key, { key, label, ord, items: [] }); G.get(key).items.push(it); };
  items.forEach(it => {
    const [x, t] = it, d = parseInt(x.date) || 0;
    if (isCur && !isPaid(x, t) && (d > td || !d)) add('next', 'À venir', -1, it);
    else if (d) add('d' + d, dayLabel(k, d), k > nowK() ? d : 100 - d, it);
    else add('nd', 'Sans date', 999, it);
  });
  const out = [...G.values()].sort((a, b) => a.ord - b.ord);
  const nx = out.find(g => g.key === 'next'); if (nx) nx.items.sort((a, b) => (parseInt(a[0].date) || 99) - (parseInt(b[0].date) || 99));
  return out;
}
function vMouvements() {
  const k = ck(), m = month(k), c = calc(m, k), V = $('v-mouvements');
  const cnt = f => groups(m, k, f, '').reduce((s, g) => s + g.items.length, 0);
  const F = [['all', 'Tout'], ['todo', 'À payer'], ['fixed', 'Fixes'], ['var', 'Variables'], ['inc', 'Recettes']];
  const gs = groups(m, k, UI.flt, UI.q.trim().toLowerCase());
  const list = gs.map(g => `<div class="lbl">${g.label}</div>` + g.items.map(([x, t]) => rowHTML(x, t, k)).join('')).join('')
    || `<p class="empty">${UI.q ? 'Aucun résultat pour « ' + esc(UI.q) + ' ».' : 'Aucun mouvement ici. Clique sur « + Ajouter ».'}</p>`;
  const searchFocused = document.activeElement && document.activeElement.id === 'q';
  V.innerHTML = `
  <div class="tiles">
    <div class="kp"><span>Recettes</span><b style="color:var(--ok)">+${eur(c.incAll)}</b><small>${eur(c.incIn)} reçues</small></div>
    <div class="kp"><span>Dépenses ${tip('dépenses', 'Dépenses du mois', eq([['Charges fixes', eur(c.fixAll)], ['+ Dépenses variables', eur(c.varAll)]], ['= Total', eur(c.outAll)], 'Montants « ½ » comptés pour ta part seulement.'))}</span><b>${minus(c.outAll)}</b><small>${eur(c.outPaid)} payées</small></div>
    <div class="kp"><span>Reste à payer ${tip('reste à payer', 'Reste à payer', 'Dépenses de ce mois pas encore marquées « Payé », charges fixes comprises. Clique sur l\'étiquette d\'une ligne pour changer son statut.', 'lf')}</span><b style="color:var(--warn)">${eur(c.outPlan)}</b><small>${m.expenses.filter(e => e.status !== 'Payé').length} élément(s)</small></div>
  </div>
  <section class="card" aria-label="Liste des mouvements" style="display:flex;flex-direction:column;gap:2px">
    <div class="ch">
      <div class="chips" role="group" aria-label="Filtrer">${F.map(([f, l]) => `<button class="chip${UI.flt === f ? ' on' : ''}" data-a="flt" data-v="${f}" aria-pressed="${UI.flt === f}">${l} · ${cnt(f)}</button>`).join('')}</div>
      <label class="search">${svg('search', 16, 2.2)}<input type="search" id="q" placeholder="Rechercher" aria-label="Rechercher un mouvement" value="${esc(UI.q)}"></label>
    </div>
    ${list}
  </section>`;
  if (searchFocused) { const q = $('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }

/* ---------- BUDGETS & ÉCHÉANCIER ---------- */

  const cards = m.budgets.map(b => {
    const s = vspent(m, b.cat), a = num(b.amount), p = pct(s, a), ci = catInfo(b.cat), r = a - s;

    const pd = r > 0 && c.left > 0 ? r / c.left : null;

      <span style="display:flex;align-items:center;gap:12px">${ico({ cat: b.cat }, 'expenses')}<b style="font-weight:700">${esc(b.cat)}</b></span>
      <span class="num" style="font-size:24px;font-weight:800">${eur(Math.abs(r))} <span style="font-size:13px;font-weight:600;color:var(--mute)">${r >= 0 ? 'restants' : 'de dépassement'}</span></span>
      <span class="bar" style="display:block"><i style="width:${Math.min(100, p)}%;--c:${col}"></i></span>
      <span class="num" style="font-size:12px;${p > 85 ? 'color:var(--warn);font-weight:600' : 'color:var(--mute)'}">${eur(s)} sur ${eur0(a)}${pd != null ? ' · ' + eur(pd) + ' / jour' : ''}</span>
    </button>`;
  }).join('');
  const bcats = new Set(m.budgets.map(b => b.cat));
  const outCats = [...new Set(m.expenses.filter(e => !e.isFixed && !bcats.has(e.cat)).map(e => e.cat))];

  // Échéancier
  const fixed = m.expenses.filter(e => e.isFixed);
  const byDay = {}; fixed.forEach(e => { const d = Math.min(parseInt(e.date) || 0, dim(k)); if (d) (byDay[d] = byDay[d] || []).push(e); });
  const first = (keyDate(k).getDay() + 6) % 7;
  let cal = ['LUN','MAR','MER','JEU','VEN','SAM','DIM'].map(w => `<span class="wk">${w}</span>`).join('') + '<span></span>'.repeat(first);
  for (let d = 1; d <= dim(k); d++) {

    const late = st.includes('late') || st.includes('due'), plan = st.includes('plan'), dotc = late ? '#F59E0B' : plan ? 'var(--acc)' : '#10B981';
    const cls = ['d', its.length ? 'has' : '', late ? 'late' : '', isCur && d === today() ? 'today' : '', UI.calDay === d ? 'sel' : ''].filter(Boolean).join(' ');
    cal += its.length ? `<button class="${cls}" data-a="calday" data-v="${d}" aria-label="${d} : ${its.length} prélèvement(s)">${d}<i style="--c:${dotc}"></i></button>` : `<span class="${cls}">${d}</span>`;
  }
  const sorted = fixed.slice().sort((a, b) => (parseInt(a.date) || 99) - (parseInt(b.date) || 99));
  const sel = UI.calDay ? sorted.filter(e => parseInt(e.date) === UI.calDay) : null;
  const todo = (sel || sorted).filter(e => e.status !== 'Payé'), done = (sel || sorted).filter(e => e.status === 'Payé');
  const line = e => rowHTML(e, 'expenses', k, { sub: e.date ? shortDay(k, parseInt(e.date)) : 'sans date' });
  const paidTot = sum(fixed.filter(e => e.status === 'Payé'), eff), todoTot = sum(fixed.filter(e => e.status !== 'Payé'), eff);

  V.innerHTML = `
  <section class="card" aria-label="Répartition des recettes" style="display:flex;flex-direction:column;gap:14px">
    <div class="ch" style="margin:0"><h2>Répartition de tes recettes ${tip('répartition', 'Répartition des recettes', 'Comment tes recettes du mois sont réparties entre ce qui est prévu (charges fixes, budgets, épargne) et ce qui reste libre.' + eq([['Recettes', eur(c.incAll)], ['− Charges fixes', eur(c.fixAll)], ['− Budgets', eur(c.budEff)], c.varOut > 0 && ['− Hors budget', eur(c.varOut)], ['− Épargne', eur(c.saving)]], ['= Libre', eur(c.free)]), 'rt')}</h2><button class="btn sm" data-a="saving">Épargne prévue : ${eur(c.saving)} · modifier</button></div>
    <div class="stack" style="height:26px;border-radius:8px">${seg.map(([, v, col]) => `<i style="flex:${v / base};--c:${col}"></i>`).join('')}</div>
    <div class="legend">${seg.map(([l, v, col]) => `<span><i style="--c:${col}"></i>${l} <b class="num">${eur(v)}</b></span>`).join('')}<span style="margin-left:auto">sur <b class="num">${eur(c.incAll)}</b> de recettes</span></div>
    ${c.free < 0 ? `<div class="alert bad">${svg('warn')}<span>Ce mois-ci, le prévu dépasse les recettes de <b>${eur(-c.free)}</b>.</span></div>` : ''}
    ${outCats.length ? `<p class="note">Dépenses sans budget : ${outCats.map(esc).join(', ')} (${eur(c.varOut)}). <button class="lnk" data-a="bud-new" data-v="${esc(outCats[0])}">Créer un budget ${esc(outCats[0])}</button></p>` : ''}
  </section>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px">
    ${cards}
    <button class="card" data-a="bud-new" style="border:2px dashed var(--line);box-shadow:none;background:none;display:flex;align-items:center;justify-content:center;gap:8px;min-height:150px;color:var(--mute);font-weight:700">${svg('plus')} Nouveau budget</button>
  </div>
  <section class="card" aria-label="Échéancier des charges fixes" style="display:flex;flex-wrap:wrap;gap:28px">

      <div class="cal">${cal}</div>
      <div class="legend" style="font-size:12px"><span><i style="--c:#10B981;border-radius:50%"></i>Payé</span><span><i style="--c:#F59E0B;border-radius:50%"></i>À payer</span><span><i style="--c:var(--acc);border-radius:50%"></i>À venir</span></div>
    </div>
    <div style="flex:1 1 320px;display:flex;flex-direction:column;gap:4px">

        <div style="background:var(--acc-s);color:var(--acc-d)"><span>À venir ${tip('à venir', 'À venir', 'Charges fixes du mois pas encore payées, y compris celles sans date (abonnements prélevés à un jour variable).', 'lf')}</span><b>${eur(todoTot)}</b></div>
      </div>

const accs = () => S.savAcc = S.savAcc || [];

// Simulation mois par mois (versements en fin de mois, intérêts composés mensuellement)
function svSim(p, r, base) {
  const mr = Math.pow(1 + r / 100, 1 / 12) - 1, N = Math.max(1, Math.round(num(p.years))) * 12;
  let capi = num(p.capital), cv = 0, gm = null, d1 = 0; const rows = [{ y: 0, cap: capi, cv: 0 }];
  for (let i = 1; i <= N; i++) {
    const yi = Math.floor((i - 1) / 12);
    const d = base != null ? base * Math.pow(1 + num(p.raise) / 100, yi)
      : p.mode === 'pct' ? num(p.salary) * Math.pow(1 + num(p.salGrowth) / 100, yi) * num(p.pct) / 100
      : num(p.monthly) * Math.pow(1 + num(p.raise) / 100, yi);
    if (i === 1) d1 = d;
    capi = capi * (1 + mr) + d; cv += d;
    if (i % 12 === 0) { capi += num(p.bonus); cv += num(p.bonus); }
    if (gm == null && num(p.goal) > 0 && capi >= num(p.goal)) gm = i;
    if (i % 12 === 0) rows.push({ y: i / 12, cap: capi, cv });
  }
  return { rows, cap: capi, cv, gm, d1 };
}
const gmTxt = gm => { const y = Math.floor(gm / 12), mo = gm % 12; return [y ? y + ' an' + (y > 1 ? 's' : '') : '', mo ? mo + ' mois' : ''].filter(Boolean).join(' '); };

      <button class="btn sm" data-a="sv-use">Partir de mon épargne actuelle (${eur0(tot)})</button>` : ''}

function hRows() {

  if (UI.hp > 0) ks = ks.slice(-UI.hp);
  if (UI.hp < 0) ks = ks.filter(k => +k.slice(0, 4) === UI.hy);
  return ks.map(k => { const m = S.months[k], c = calc(m, k);
    return { k, m, inc: c.incAll, out: c.outAll, sav: c.saving, net: c.incAll - c.outAll, tx: c.incAll > 0 ? (c.incAll - c.outAll) / c.incAll * 100 : null, start: c.init, end: c.est, cur: k === nk }; });
}

function restoreBackup(id) {

}

function panelClick(b) {
  const a = b.dataset.p, d = P.d;
  switch (a) {
    case 'close': return closePanel();
    case 'type': P.type = b.dataset.v; d.status = P.type === 'incomes' ? (d.status === 'Payé' ? 'Reçu' : 'En attente') : (d.status === 'Reçu' ? 'Payé' : 'Prévu'); break;
    case 'half': d.isDivided = !d.isDivided; break;
    case 'cat': d.cat = b.dataset.v; break;
    case 'addcat': P.addCat = !P.addCat; paintPanel(); return $('pn-nc')?.focus();
    case 'addcat-ok': { const v = $('pn-nc').value.trim(); if (!v) return; if (!S.categories.includes(v)) S.categories.push(v); d.cat = v; P.addCat = false; break; }
    case 'icon': P.icon = b.dataset.v; break;
    case 'pickimg': return $('imgfile').click();
    case 'status': d.status = P.type === 'incomes' ? (d.status === 'Reçu' ? 'En attente' : 'Reçu') : (d.status === 'Payé' ? 'Prévu' : 'Payé'); break;
    case 'repeat': P.repeat = b.checked; return;
    case 'future': P.future = b.checked; return;
    case 'save': return savePanel();
    case 'dup': { const t = P.type, src = month()[t].find(e => e.id === P.id); mutate(() => { const c = JSON.parse(JSON.stringify(src)); Object.assign(c, { id: uid(), isFixed: false, status: t === 'incomes' ? 'En attente' : 'Prévu' }); delete c.tmplId; const arr = month()[t]; arr.splice(arr.indexOf(src) + 1, 0, c); }, 'Dupliqué'); return closePanel(); }
    case 'del': { const t = P.type, id = P.id; mutate(() => { const m = month(); m[t] = m[t].filter(e => e.id !== id); }, 'Supprimé'); return closePanel(); }
    case 'stop': { const t = P.type, id = P.id; mutate(() => { const x = month()[t].find(e => e.id === id); tplDel(t, x.tmplId, shiftK(ck(), 1)); x.isFixed = false; delete x.tmplId; }, 'Récurrence arrêtée'); return closePanel(); }
  }
  paintPanel();
}
function savePanel() {
  const d = P.d, t = P.type, amt = parseAmt(d.amount);
  if (!(amt > 0)) { $('pn-a').focus(); return toast('Saisis un montant'); }
  const k = ck(), isNew = P.isNew, id = P.id, repeat = P.repeat, future = P.future, icon = P.icon;
  mutate(() => {
    const m = month(k);
    const clean = { name: d.name.trim() || (t === 'incomes' ? 'Recette' : d.cat), amount: Math.round(amt * 100) / 100, date: day(d.date), status: d.status };
    if (t === 'expenses') Object.assign(clean, { cat: d.cat, isDivided: !!d.isDivided });
    const setIcon = x => { delete x.site; delete x.img; if (icon === 'site' && cleanSite(d.site)) x.site = cleanSite(d.site); if (icon === 'img' && d.img) x.img = d.img; };
    let x;
    if (isNew) { x = { id: uid(), ...clean, isFixed: false }; setIcon(x); m[t].unshift(x); }
    else {
      x = m[t].find(e => e.id === id); Object.assign(x, clean); setIcon(x);
      if (x.isFixed && future) {
        const tp = S.templates[t].find(z => z.tmplId === x.tmplId);
        if (tp) { const F = tplFields(t); F.forEach(f => { if (x[f] === undefined || x[f] === '') delete tp[f]; else tp[f] = x[f]; }); syncTpl(t, tp, F, shiftK(k, 1)); }
      }
    }
    if (!x.isFixed && repeat) { const tp = tplFrom(t, x); x.isFixed = true; x.tmplId = tp.tmplId; tplAdd(t, tp, shiftK(k, 1)); }
  }, isNew ? (t === 'incomes' ? 'Recette ajoutée · ' : 'Dépense ajoutée · ') + eur(t === 'expenses' && d.isDivided ? amt / 2 : amt) : 'Modifié');
  closePanel();
}
// Image perso → redimensionnée en 96 px (stockée avec les données)
function readImage(f) {
  if (!f || !P) return;
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => {
    const s = 96, cv = document.createElement('canvas'); cv.width = cv.height = s;
    const g = cv.getContext('2d'), z = Math.min(im.width, im.height);
    g.drawImage(im, (im.width - z) / 2, (im.height - z) / 2, z, z, 0, 0, s, s);
    P.d.img = cv.toDataURL('image/png'); P.icon = 'img'; paintPanel();
  }; im.src = r.result; };
  r.readAsDataURL(f); $('imgfile').value = '';
}

function formDialog({ title, intro, fields, ok = 'Enregistrer', onSave, onDelete, delLabel = 'Supprimer' }) {

  d.innerHTML = `<form class="dw"><div class="dh"><h2>${title}</h2><button type="button" class="ib sm" data-x aria-label="Fermer">${svg('x', 16, 2.4)}</button></div>
    ${intro ? `<p class="note">${intro}</p>` : ''}${fields.map(fh).join('')}
    <div class="dact">${onDelete ? `<button type="button" class="btn danger" data-del>${delLabel}</button>` : ''}<button class="btn p">${ok}</button></div></form>`;
  d.querySelector('[data-x]').onclick = () => d.close();
  if (onDelete) d.querySelector('[data-del]').onclick = () => { d.close(); onDelete(); };
  d.querySelector('form').onsubmit = e => {
    e.preventDefault(); const v = {};
    fields.forEach(f => { const el = $('f_' + f.id); v[f.id] = f.type === 'num' ? (el.value.trim() === '' ? null : parseAmt(el.value)) : el.value.trim(); });

  d.showModal(); d.querySelector('input,select')?.focus();
}

    onSave: v => mutate(() => {
      const x = a ? accs().find(y => y.id === id) : (accs().push({ id: uid(), hist: {} }), accs()[accs().length - 1]);
      x.name = v.name || v.type; x.type = v.type; x.rate = num(v.rate); x.hist = x.hist || {}; x.hist[nowK()] = num(v.bal);
    }, a ? 'Compte mis à jour' : 'Compte ajouté'),
    onDelete: a ? () => { if (confirm('Supprimer ce compte et son historique ?')) mutate(() => { S.savAcc = accs().filter(x => x.id !== id); }, 'Compte supprimé'); } : null });
}
function balancesDialog() {
  const A = accs();
  formDialog({ title: 'Mes soldes · ' + mlab(nowK()), intro: 'Saisis le solde actuel de chaque compte. L\'historique mois par mois est conservé.',
    fields: A.map(a => ({ id: a.id, label: esc(a.name), type: 'num', value: aBal(a) })),
    onSave: v => mutate(() => { accs().forEach(a => { if (v[a.id] != null) { a.hist = a.hist || {}; a.hist[nowK()] = v[a.id]; } }); }, 'Soldes mis à jour') });
}
function alertsDialog() {
  const L = alerts(nowK()), d = $('dlg');
  d.innerHTML = `<div class="dw"><div class="dh"><h2>Alertes · ${mlab(nowK())}</h2><button class="ib sm" data-x aria-label="Fermer">${svg('x', 16, 2.4)}</button></div>
    ${L.map((a, i) => `<button class="alert ${a.lvl === 'bad' ? 'bad' : ''}" data-al-i="${i}" style="border:0;text-align:left;cursor:pointer">${svg('warn')}<span>${esc(a.text)}</span></button>`).join('') || '<p class="empty">Tout est sous contrôle ce mois-ci.</p>'}
    <p class="note">Seuils réglables dans Paramètres › Alertes.</p></div>`;
  d.querySelector('[data-x]').onclick = () => d.close();
  d.onclick = e => { const b = e.target.closest('[data-al-i]'); if (!b) return; const a = L[+b.dataset.alI]; d.close(); cur = keyDate(nowK()); go(a.go, { flt: a.flt || 'all', q: a.q || '' }); };
  d.showModal();
}

/* ============================== 10. ÉVÉNEMENTS ============================== */
document.addEventListener('click', ev => {
  const pb = ev.target.closest('#panel [data-p]');
  if (pb && P) return panelClick(pb);
  if (ev.target.id === 'scrim') return closePanel();
  const b = ev.target.closest('[data-view],[data-a]'); if (!b || !loaded) return;
  if (b.dataset.view) return go(b.dataset.view);
  const a = b.dataset.a, k = ck(), m = month(k), t = b.dataset.t, id = b.dataset.id;
  switch (a) {
    case 'prev': case 'next': cur.setMonth(cur.getMonth() + (a === 'next' ? 1 : -1)); UI.calDay = null; UI.showPaid = false; return render();
    case 'today': cur = keyDate(nowK()); UI.calDay = null; return render();
    case 'new': return openPanel('expenses');
    case 'open': return openPanel(t, id);
    case 'tst': return mutate(() => { const x = m[t].find(e => e.id === id); x.status = t === 'incomes' ? (x.status === 'Reçu' ? 'En attente' : 'Reçu') : (x.status === 'Payé' ? 'Prévu' : 'Payé'); },
      (t === 'incomes' ? 'Recette ' : '') + (m[t].find(e => e.id === id).status === (t === 'incomes' ? 'Reçu' : 'Payé') ? (t === 'incomes' ? 'en attente' : 'Marqué à payer') : (t === 'incomes' ? 'reçue' : 'Marqué payé ✓')));
    case 'flt': UI.flt = b.dataset.v; return render();
    case 'alerts': return alertsDialog();
    case 'alertgo': { const al = alerts(k)[0]; if (al) go(al.go, { flt: al.flt || 'all', q: al.q || '' }); return; }
    case 'bank': return bankDialog();
    case 'saving': return savingDialog();
    case 'ob-inc': return openPanel('incomes', null, { repeat: true });
    case 'ob-fix': return openPanel('expenses', null, { repeat: true });
    case 'bud': return budgetDialog(id);
    case 'bud-new': return budgetDialog(null, b.dataset.v);
    case 'calday': UI.calDay = UI.calDay === +b.dataset.v ? null : +b.dataset.v; return render();
    case 'showpaid': UI.showPaid = true; return render();
    // Épargne
    case 'acc': return accountDialog(id);
    case 'acc-new': return accountDialog(null);
    case 'acc-bal': return balancesDialog();
    case 'svmode': sv().mode = b.dataset.v; save(); return render();
    case 'svmore': UI.svMore = !UI.svMore; return render();
    case 'sv-use': { const tot = sum(accs(), x => aBal(x)), A = accs(); const w = tot > 0 ? sum(A, x => aBal(x) * num(x.rate)) / tot : 0;
      sv().capital = Math.round(tot * 100) / 100; if (w > 0) sv().rate = Math.round(w * 10) / 10; save(); render(); return toast('Départ : ' + eur(tot)); }
    case 'sv-apply': { const v = Math.round(svSim(sv(), num(sv().rate)).d1 * 100) / 100; return mutate(() => { month(nowK()).savingGoal = v; }, 'Épargne prévue de ' + mlab(nowK()) + ' : ' + eur(v)); }
    case 'sv-take': sv().monthly = num(month(nowK()).savingGoal); sv().mode = 'fix'; save(); render(); return toast('Versement repris : ' + eur(sv().monthly));
    // Historique
    case 'hp': UI.hp = +b.dataset.v; return render();
    case 'hy': UI.hy += +b.dataset.v; return render();
    case 'gom': return goMonth(b.dataset.v);
    case 'csv': return exportCSV();
    case 'pdf': return print();
    // Paramètres
    case 'pwd': return changePassword();
    case 'delacc': return deleteAccount();
    case 'logout': return logout();
    case 'bk-now': return backupNow('manuelle').then(ok => { toast(ok ? '💾 Sauvegarde créée' : 'Rien à sauvegarder'); if (ok && $('bk-list')?.innerHTML) listBackups(); });
    case 'bk-list': return listBackups();
    case 'bk-res': return restoreBackup(id);
    case 'bk-dl': { const dd = bkCache[id]; if (dd) download('budget_sauvegarde_' + id.slice(0, 10) + '.json', JSON.stringify(JSON.parse(dd), null, 2), 'application/json'); return; }
    case 'export': download('budget_perso_' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(JSON.parse(snapshot()), null, 2), 'application/json'); return toast('Export téléchargé');
    case 'import': return $('file').click();
    case 'reset': if (!confirm('Effacer TOUT ton budget ? Une sauvegarde sera faite juste avant. Ton compte n\'est pas supprimé.')) return;
      backupNow('avant réinitialisation'); return mutate(() => { S = normalize(fresh()); }, 'Budget réinitialisé');
    case 'addcat': { const v = $('newcat').value.trim(); if (!v || S.categories.includes(v)) return toast('Catégorie vide ou déjà existante'); return mutate(() => S.categories.push(v), 'Catégorie ajoutée'); }
    case 'delcat': { const c = S.categories[+b.dataset.i]; if (!confirm(`Supprimer la catégorie « ${c} » ? Les mouvements existants la gardent.`)) return; return mutate(() => S.categories.splice(+b.dataset.i, 1), 'Catégorie supprimée'); }
    case 'tadd': { const n = t === 'expenses' ? { tmplId: uid(), date: '', cat: S.categories[0] || 'Autre', name: 'Nouvelle charge', amount: 0, isDivided: false }
        : t === 'incomes' ? { tmplId: uid(), date: '', name: 'Nouvelle recette', amount: 0 } : { tmplId: uid(), cat: S.categories[0] || 'Autre', amount: 0 };
      return mutate(() => tplAdd(t, n, k), 'Ajouté'); }
    case 'thalf': { const tr = b.closest('[data-tpl]'), x = S.templates.expenses.find(y => y.tmplId === tr.dataset.id); return mutate(() => { x.isDivided = !x.isDivided; syncTpl('expenses', x, ['isDivided'], k); }, false); }
    case 'tdel': { const tr = b.closest('[data-tpl]'); if (!confirm('Supprimer cet élément récurrent ? Ce qui n\'est pas encore réglé sera retiré de ' + mlab(k) + ' et des mois suivants.')) return;
      return mutate(() => tplDel(tr.dataset.tpl, tr.dataset.id, k), 'Supprimé'); }
  }
});

// Saisie au clavier
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'q') { UI.q = el.value; return render(); }
  if (el.dataset.pf && P) {
    P.d[el.dataset.pf] = el.value;
    if (el.dataset.pf === 'name' && P.type === 'expenses') { const c = autoCat(el.value); if (c && c !== P.d.cat) { P.d.cat = c; $$('#panel [data-p=cat]').forEach(b => b.classList.toggle('on', b.dataset.v === c)); } }
    if (el.dataset.pf === 'amount' && P.d.isDivided) { const h = $$('#panel [data-p=half]')[0]; if (h) h.textContent = '½ Partagé · ma part ' + eur(parseAmt(el.value) / 2); }
    return;
  }
  if (el.dataset.sv) {                                          // simulateur : mise à jour en direct
    const p = sv(), f = el.dataset.sv; p[f] = parseFloat(el.value) || 0; if (f === 'years') p.years = Math.min(60, Math.max(1, p.years));
    const l = $$(`[data-svl="${f}"]`)[0]; if (l) l.textContent = String(p[f]).replace('.', ',') + el.dataset.u;
    svResults();
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'file') return importFile(el.files[0]);
  if (el.id === 'imgfile') return readImage(el.files[0]);
  if (el.id === 'pn-site' && P) return paintPanel();
  if (el.dataset.sv) return save();
  if (el.dataset.al) { const f = el.dataset.al, v = parseFloat(el.value) || 0; return mutate(() => { AL()[f] = v; }, 'Seuil d\'alerte enregistré'); }
  const tr = el.closest('[data-tpl]'), f = el.dataset.f;
  if (tr && f) {
    let v = el.value; if (f === 'amount') v = Math.max(0, parseAmt(v)); if (f === 'date') v = day(v); if (f === 'site') v = cleanSite(v);
    const ty = tr.dataset.tpl, x = S.templates[ty].find(y => y.tmplId === tr.dataset.id);
    const c = f === 'name' && ty === 'expenses' ? autoCat(v) : null;
    setTimeout(() => mutate(() => { if (v === '' && f === 'site') delete x[f]; else x[f] = v; syncTpl(ty, x, [f]); if (c && x.cat !== c) { x.cat = c; syncTpl(ty, x, ['cat']); } }, false), 0);  // après le déplacement du focus
  }
});
function importFile(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { const d = JSON.parse(r.result); if (!d.templates || !d.months) throw 0;
      if (!confirm('Remplacer tes données par ce fichier ? Une sauvegarde sera faite juste avant.')) return;
      backupNow('avant import'); mutate(() => { S = normalize(d); }, 'Import réussi');
    } catch (e) { toast('Fichier invalide'); }
  };
  r.readAsText(f); $('file').value = '';
}

// Raccourcis : N nouveau · / rechercher · ← → mois · Échap fermer · Ctrl+Z annuler
document.addEventListener('keydown', e => {
  if (!loaded) return;
  if (e.key === 'Escape' && P) return closePanel();
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing && undoSnap) { e.preventDefault(); return undo(); }
  if (typing || P || $('dlg').open || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'n') { e.preventDefault(); openPanel('expenses'); }
  if (e.key === '/') { e.preventDefault(); if (UI.view !== 'mouvements') go('mouvements'); $('q')?.focus(); }
  if (MONTH_VIEWS.includes(UI.view) && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { cur.setMonth(cur.getMonth() + (e.key === 'ArrowRight' ? 1 : -1)); render(); }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-a=gom]')) goMonth(e.target.dataset.v);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => render());

/* ---------- Démarrage ---------- */
try { const v = localStorage.getItem('bt'); if (VIEWS.some(x => x[0] === v)) UI.view = v; } catch (e) {}
showScreen('loading');

</script>
</body>
